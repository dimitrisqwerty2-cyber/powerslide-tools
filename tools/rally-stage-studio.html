  :root { --bg: #1c1c1c; --panel-bg: #2a2a2a; --text: #f9f9f9; --text-dim: #a0a0a0; --accent: #fc4d03; --border: #333333; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background-color: var(--bg); color: var(--text); font-family: 'WRC Clean Roman', sans-serif; font-size: 14px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header { background-color: #111; padding: 12px 24px; border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; }
  header h1 { font-size: 18px; font-weight: 600; letter-spacing: 0.5px; font-family: 'WRC Clean Bold', sans-serif; }
  .btn { background: #333; color: #fff; border: 1px solid #555; padding: 6px 12px; border-radius: 4px; font-family: 'WRC Clean Bold', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; }
  .btn:hover { background: #444; }
  .btn.primary { background: var(--accent); border-color: var(--accent); }
  .btn.primary:hover { background: #d64102; }
  .header-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; }
  .container { display: flex; flex: 1; overflow: hidden; }
  /* One column, one scrollbar: every section stands at its own height and the sidebar
     scrolls as a whole. Boxing each list into its own short scroller cut cards in half. */
  .sidebar { width: 380px; background-color: var(--panel-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 10; overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; scrollbar-color: #4a4a4a transparent; }
  .sidebar > * { flex: 0 0 auto; }
  .sidebar::-webkit-scrollbar { width: 9px; }
  .sidebar::-webkit-scrollbar-thumb { background: #4a4a4a; border-radius: 5px; border: 2px solid var(--panel-bg); }
  .sidebar::-webkit-scrollbar-track { background: transparent; }
  /* Headers stay put while you scroll their own section, so you always know where you are */
  .sidebar-header { position: sticky; top: 0; z-index: 6; padding: 12px 16px; border-bottom: 1px solid var(--border); font-weight: 600; color: var(--text-dim); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; background: #222; display: flex; justify-content: space-between; align-items: center;}
  .stage-meta { padding: 10px; background:#1a1a1a; border-bottom:1px solid var(--border); display:grid; grid-template-columns:1fr 1fr; gap:7px; }
  .stage-meta .meta-wide { grid-column:1 / -1; }
  .stage-meta label { display:block; color:#888; font-size:9px; text-transform:uppercase; letter-spacing:.6px; margin-bottom:3px; }
  .stage-meta input, .stage-meta select { width:100%; background:#111; border:1px solid #444; color:#fff; border-radius:4px; padding:5px 6px; font-family:'WRC Clean Roman',sans-serif; font-size:12px; }

  .list-container { padding: 10px; border-bottom: 1px solid #111; }
  .pois-container { padding: 10px; background: #222; border-top: 1px solid var(--border); }
  .sidebar-header.collapsible { cursor: pointer; user-select: none; }
  .sidebar-header.collapsible:hover { background: #2a2a2a; }
  .sidebar-header .chev { display: inline-block; width: 12px; margin-right: 5px; color: #777; font-size: 10px; transition: transform .15s; }
  .sidebar-header.is-folded .chev { transform: rotate(-90deg); }
  .is-collapsed { display: none !important; }
  .stages-container { padding: 7px 10px; background: #1e1e1e; border-bottom: 1px solid var(--border); }
  .stage-row { display: flex; align-items: center; gap: 8px; background: #1c1c1c; border: 1px solid var(--border); border-radius: 5px; padding: 5px 7px; margin-bottom: 5px; }
  .stage-row:last-child { margin-bottom: 0; }
  .stage-num { flex: 0 0 18px; height: 18px; border-radius: 3px; background: #333; color: #aaa; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .stage-name { flex: 1; font-size: 12px; color: #ddd; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stage-row.is-main .stage-num { background: var(--accent); color: #fff; }
  .stage-row.is-main .stage-name { color: #fff; font-weight: 600; }
  .stage-name em { font-style: normal; color: #777; font-size: 10px; }
  .stage-move { display: flex; gap: 3px; }
  .stage-move button { background: #2a2a2a; color: #ccc; border: 1px solid #444; border-radius: 3px; width: 20px; height: 20px; line-height: 1; padding: 0; font-size: 9px; cursor: pointer; }
  .stage-move button:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); color: #fff; }
  .stage-move button:disabled { opacity: .3; cursor: default; }
  .card { background: #1c1c1c; border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-bottom: 10px; position: relative; transition: 0.2s ease; cursor: pointer; }
  .card:hover { border-color: #555; }
  .card.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .card input[type="text"], .card input[type="number"] { width: 100%; background: #111; border: 1px solid #444; color: #fff; padding: 6px 8px; border-radius: 4px; margin-bottom: 8px; font-family: 'WRC Clean Roman', sans-serif; font-size: 14px; font-weight: 600; }
  .card textarea { width: 100%; background: #111; border: 1px solid #444; color: #ccc; padding: 6px 8px; border-radius: 4px; font-family: 'WRC Clean Roman', sans-serif; font-size: 12px; resize: vertical; min-height: 50px; margin-bottom: 8px; }
  .card-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .card-meta span { font-size: 11px; color: #888; font-weight: bold; }
  .color-picker { border: none; width: 24px; height: 24px; border-radius: 4px; cursor: pointer; padding: 0; background: transparent; }
  /* Live preview of an export link button, styled the same as the exported page */
  .slink-preview .slink { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 15px; background: linear-gradient(var(--lg), var(--lg)), rgba(10,10,10,.9); border: 1px solid var(--lb); color: var(--lc); text-decoration: none; font-family: 'WRC Clean Bold', sans-serif; font-size: 11px; letter-spacing: .3px; transition: color .2s, border-color .2s, background .2s; }
  .slink-preview .slink.icon-only { width: 30px; padding: 0; justify-content: center; }
  .slink-preview .slink:hover { background: var(--lc); border-color: var(--lc); color: var(--lf); }
  .flex-row { display: flex; gap: 8px; }
  .flex-row > * { flex: 1; }
  .map-wrapper { flex: 1; position: relative; }
  #map { width: 100%; height: 100%; background: #0a0a0a; z-index: 1; }
  /* Dark basemap: OSM raster tiles inverted in CSS. CARTO's dark_all now
     stamps 'API KEY REQUIRED' over keyless requests, so we build the black
     style locally instead of depending on a keyed tile service. sepia+hue-rotate
     collapses the map to a single navy hue so no stray greens survive. */
  .leaflet-layer.dark-basemap-tiles { filter: invert(1) sepia(1) hue-rotate(170deg) saturate(.75) brightness(.72) contrast(1.1); }
  /* Broadcast basemap: the same Esri imagery run through a colour matrix that keeps the
     terrain's shading and rolls it onto the navy the WRC's TV maps use. It holds luminance,
     pulls red down a little and adds a flat amount of blue - the last part is what a chain
     of multiplying filters cannot do, which is why they go purple in the highlights. The
     plain chain in front is the fallback for anything that cannot resolve url(). */
  .leaflet-layer.tv-basemap-tiles { filter: grayscale(1) sepia(1) hue-rotate(186deg) saturate(1.7) brightness(1.02); filter: url(#tv-navy); }


  /* ---- Custom floating tooltip ---- */
  /* We build our own tooltip div that we move with JS, bypassing Leaflet's tooltip system entirely for sector hover */
  #custom-hover {
    position: absolute;
    z-index: 9999;
    pointer-events: none;
    display: none;
    flex-direction: column;
    align-items: center;
    transform: translate(-50%, calc(-100% - 14px)); /* center-x, sit above cursor */
  }
  #custom-hover .ch-box {
    background: rgba(15,15,15,0.97);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    padding: 10px 14px;
    max-width: 230px;
    white-space: normal;
    font-family: 'WRC Clean Roman', sans-serif;
    box-shadow: 0 6px 24px rgba(0,0,0,0.8);
  }
  @media (max-width: 600px) {
    #custom-hover .ch-box { max-width: 160px; padding: 7px 10px; }
    #custom-hover .ch-title { font-size: 12px !important; }
    #custom-hover .ch-desc  { font-size: 11px !important; }
    #custom-hover .ch-meta  { font-size: 11px !important; }
  }
  #custom-hover .ch-title { font-weight: 700; font-size: 14px; margin-bottom: 5px; }

<script>

async function compressBase64(b64) {
    if(!b64 || !b64.startsWith('data:image')) return b64;

    return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height; const max = 900;
            if(w > max || h > max) { if(w > h) { h = Math.round(h * max / w); w = max; } else { w = Math.round(w * max / h); h = max; } }
            canvas.width = w; canvas.height = h;

            // Fill with white background in case of transparent PNGs
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);

            resolve(canvas.toDataURL('image/jpeg', 0.88));
        };
        img.onerror = () => resolve(b64); // Fallback
        img.src = b64;
    });
}

/* ---- Export-time photo optimiser ----
   The project keeps the photo the user uploaded; the export gets a copy sized for how
   it is actually displayed (a 180px popup). Photos are 60-90% of a typical export, so
   this is where nearly all the file size lives. Re-encoding is skipped when the source
   is already small enough and already lossy, which keeps export -> import -> export
   round trips from stacking up generation loss. */
const photoShrinkCache = new Map();
function exportPhotoTier(){
  const sel=document.getElementById('export-quality');
  const opt=sel && sel.options[sel.selectedIndex];
  return { max:parseInt(opt&&opt.dataset.photoMax,10)||600, q:parseFloat(opt&&opt.dataset.photoQ)||0.75 };
}
function shrinkPhoto(src, max, q){
  if(!src || !/^data:image\//i.test(src)) return Promise.resolve(src);
  const key=max+'|'+q+'|'+src;
  if(photoShrinkCache.has(key)) return Promise.resolve(photoShrinkCache.get(key));
  return new Promise(resolve=>{
    const done=v=>{ photoShrinkCache.set(key,v); resolve(v); };
    const img=new Image();
    img.onerror=()=>done(src);
    img.onload=()=>{
      try{
        const w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
        if(!w||!h) return done(src);
        const scale=Math.min(1, max/Math.max(w,h));
        // Only skip what this optimiser already produced. A jpeg straight from the
        // uploader still has room in it, and re-encoding webp->webp is what would
        // actually stack up generation loss across repeated exports.
        if(scale===1 && /^data:image\/webp/i.test(src)) return done(src);
        const cw=Math.max(1,Math.round(w*scale)), ch=Math.max(1,Math.round(h*scale));
        const c=document.createElement('canvas'); c.width=cw; c.height=ch;
        c.getContext('2d').drawImage(img,0,0,cw,ch);
        let out=c.toDataURL('image/webp',q);            // webp keeps alpha and beats jpeg
        if(!/^data:image\/webp/i.test(out)) out=c.toDataURL('image/jpeg',q);
        done(out.length<src.length ? out : src);        // never trade up
      }catch(_){ done(src); }
    };
    img.src=src;
  });
}
async function shrinkPhotosIn(list, tier){
  for(const item of list){ if(item.photo) item.photo=await shrinkPhoto(item.photo, tier.max, tier.q); }
  return list;
}

async function compressAllLoadedPhotos() {
    for(let s of sectorsData) { if(s.photo) s.photo = await compressBase64(s.photo); }
    for(let p of poisData) { if(p.photo) p.photo = await compressBase64(p.photo); }
    for(let s of mergedSectors) { if(s.photo) s.photo = await compressBase64(s.photo); }
    for(let p of mergedPois) { if(p.photo) p.photo = await compressBase64(p.photo); }
}

let map, fullTrackCoords=[], cumulativeDistances=[], totalTrackDist=0;
let splitIndices=[], sectorsData=[], mapLayers=[];
let poisData=[], poiIdCounter=0, isSplitMode=false;
let linksData=[], linkIdCounter=0;
let selectedSectorId=null, sectorLayers={}, poiLayers={};
let mergedSectors=[], mergedPois=[], mergedCount=0;
let mainStagePos=0; // where the editable stage sits in the exported stage order

/* Stages are stored flat; a new stage begins at each sector with id 0. */
function stageEntries(){
  const groups=[]; let cur=null;
  mergedSectors.forEach(sec=>{
    if(sec.id===0 || !cur){ cur={label:sec.stageLabel||sec.name||'Stage', sectors:[]}; groups.push(cur); }
    cur.sectors.push(sec);
  });
  const list=groups.map(g=>({kind:'merged', label:g.label, sectors:g.sectors}));
  const mainLabel=[stageMeta.number,stageMeta.name].filter(Boolean).join(' · ')||'Stage';
  const pos=Math.min(Math.max(0, mainStagePos), list.length);
  list.splice(pos, 0, {kind:'main', label:mainLabel, sectors:null});
  return list;
}
function moveStage(from, to){
  const list=stageEntries();
  if(to<0 || to>=list.length) return;
  const [item]=list.splice(from,1); list.splice(to,0,item);
  mainStagePos=list.findIndex(e=>e.kind==='main');
  mergedSectors=list.filter(e=>e.kind==='merged').reduce((acc,e)=>acc.concat(e.sectors),[]);
  renderUI();
}
let stageMeta={rally:'',number:'',name:'',year:'',surface:'Gravel'};
function updateStageMeta(){
  stageMeta={rally:document.getElementById('meta-rally').value.trim(),number:document.getElementById('meta-number').value.trim(),name:document.getElementById('meta-name').value.trim(),year:document.getElementById('meta-year').value.trim(),surface:document.getElementById('meta-surface').value};
  if(typeof renderStages==='function' && document.getElementById('stages-list')) renderStages();
  const fnInput=document.getElementById('export-filename');
  if(fnInput) fnInput.placeholder=suggestFilename();
}
function fillStageMeta(){
  document.getElementById('meta-rally').value=stageMeta.rally||''; document.getElementById('meta-number').value=stageMeta.number||''; document.getElementById('meta-name').value=stageMeta.name||''; document.getElementById('meta-year').value=stageMeta.year||''; document.getElementById('meta-surface').value=stageMeta.surface||'Gravel';
}
const palette=['#fc4d03','#00f7ff','#00ff88','#ffe600','#ff00cc','#ffffff','#ff9900'];

/* ---- Custom hover tooltip helpers ---- */
const hoverEl    = document.getElementById('custom-hover');
const hoverTitle = document.getElementById('ch-title');
const hoverDesc  = document.getElementById('ch-desc');
const hoverMeta  = document.getElementById('ch-meta');
const hoverLine  = document.getElementById('ch-line');
const mapWrapper = document.querySelector('.map-wrapper');

const hoverImg = document.getElementById('ch-img');
function showHover(e, sec) {
  if (sec.photo) { hoverImg.src = sec.photo; hoverImg.style.display = 'block'; } else { hoverImg.style.display = 'none'; hoverImg.src = ''; }
  hoverTitle.textContent = sec.name;
  hoverTitle.style.color = sec.color;
  hoverDesc.textContent  = sec.desc;
  hoverMeta.innerHTML    = `Length&nbsp; <span>${sec.dist}&nbsp;km</span>` + (ytId(sec.video) ? ` &nbsp;<span style="color:#ff4444">&#9654;&nbsp;Video</span>` : '');
  hoverLine.style.background = sec.color;
  hoverEl.style.borderTopColor = sec.color;
  moveHover(e);
  hoverEl.style.display = 'flex';
}

function moveHover(e) {
  const rect = mapWrapper.getBoundingClientRect();
  hoverEl.style.left = (e.clientX - rect.left) + 'px';
  hoverEl.style.top  = (e.clientY - rect.top)  + 'px';
}

function hideHover() { hoverEl.style.display = 'none'; }

/* ---- Error ---- */
function showError(msg) {
  const el=document.getElementById('error-box'); el.innerText=msg; el.style.display='block';
  el.style.background=''; // back to the warning colour
  setTimeout(()=>el.style.display='none',5000);
}
/* Same strip, green, for "this worked" messages such as the exported file size. */
function showNotice(msg) {
  const el=document.getElementById('error-box'); el.innerText=msg; el.style.display='block';
  el.style.background='#1f7a3d';
  setTimeout(()=>{ el.style.display='none'; el.style.background=''; },5000);
}

/* ---- Map init ---- */
map = L.map('map',{zoomControl:true,center:[38.68,22.578],zoom:3,tap: true});
// tile.openstreetmap.org serves an 'Access blocked' tile to any request without a
// Referer, and file:// pages, blob: previews and srcdoc copies never send one. There
// we use FAU's mirror: the same standard OSM style (rendered at 2x) with no Referer check.
const OSM_TILES = /^https?:$/.test(location.protocol)
  ? 'https://tile.openstreetmap.org/{z}/{x}/{y}.png'
  : 'https://{s}.osm.rrze.fau.de/osmhd/{z}/{x}/{y}.png';
const mapTileStyles = {
  dark: L.tileLayer(OSM_TILES,{attribution:'&copy; OpenStreetMap contributors',maxZoom:19,className:'dark-basemap-tiles'}),
  satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Tiles &copy; Esri',maxZoom:19}),
  broadcast: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Tiles &copy; Esri',maxZoom:19,className:'tv-basemap-tiles'}),
  plain: L.tileLayer(OSM_TILES,{attribution:'&copy; OpenStreetMap contributors',maxZoom:19})
};
let currentMapStyle = 'broadcast';
mapTileStyles[currentMapStyle].addTo(map);
function setMapStyle(styleName){
  if(!mapTileStyles[styleName] || styleName===currentMapStyle) return;
  map.removeLayer(mapTileStyles[currentMapStyle]);
  currentMapStyle = styleName;
  mapTileStyles[currentMapStyle].addTo(map);
  document.querySelectorAll('#map-style-switcher .map-style-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.style===styleName);
  });
}
map.on('click', e=>{ if(!isSplitMode) selectSector(null); });
document.addEventListener('DOMContentLoaded', ()=>renderLinks());

/* ---- Collapsible sidebar sections ----
   The sidebar is one scrolling column and each section is as tall as its content, so a
   sector's notes or a point's photo and video fields are never cut off by a pane that
   happens to be 44px tall. Folding a section is what makes room now, and which sections
   are folded is remembered. */
let foldedSections={};
function paneEls(){ return {poi:document.getElementById('pois-list'), links:document.getElementById('links-list'), sectors:document.getElementById('sectors-list')}; }
function isHidden(el){ return !el || el.classList.contains('is-collapsed') || el.style.display==='none'; }
function savePaneState(){
  try{ localStorage.setItem('rss-panes', JSON.stringify({folded:foldedSections})); }catch(_){}
}
/* Nothing to lay out any more - the column sizes itself. Kept because the loaders call it
   when a panel appears or the route changes. */
function relayoutPanes(){}
function toggleSection(headerEl){
  const target=document.getElementById(headerEl.dataset.target);
  if(!target) return;
  const folding = !target.classList.contains('is-collapsed');
  target.classList.toggle('is-collapsed', folding);
  headerEl.classList.toggle('is-folded', folding);
  foldedSections[headerEl.dataset.target] = folding;
  savePaneState();
  if(typeof map!=='undefined' && map.invalidateSize) map.invalidateSize();
}
function initSidebarSections(){
  let saved=null;
  try{ saved=JSON.parse(localStorage.getItem('rss-panes')||'null'); }catch(_){}
  foldedSections = (saved && saved.folded) || {};
  document.querySelectorAll('.sidebar-header.collapsible').forEach(h=>{
    const target=document.getElementById(h.dataset.target);
    if(target && foldedSections[h.dataset.target]){ target.classList.add('is-collapsed'); h.classList.add('is-folded'); }
    h.addEventListener('click', e=>{ if(e.target.closest('button')) return; toggleSection(h); });
  });
}
document.addEventListener('DOMContentLoaded', initSidebarSections);

/* ---- Select sector ---- */
function selectSector(id) {
  selectedSectorId = id;
  sectorsData.forEach(sec => {
    const l = sectorLayers[sec.id]; if(!l) return;
    const on = (id===null || id===sec.id);
    if(id===sec.id){ l.glow.setStyle({weight:10,opacity:1}); l.core.setStyle({weight:4,opacity:1}); l.glow.bringToFront(); l.core.bringToFront(); }
    else            { l.glow.setStyle({weight:7.5,opacity: on?0.9:0.3}); l.core.setStyle({weight:3,opacity: on?1:0.35}); }
  });
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('active'));
  if(id!==null){ const c=document.getElementById(`card-${id}`); if(c) c.classList.add('active'); }
  Object.values(poiLayers||{}).forEach(m=>{ if(m && m.bringToFront) m.bringToFront(); });
}


/* ---- Parse ---- */
function simplifyPoints(pts, forceThreshold) {
  if(pts.length < 3) return pts;
  const t = forceThreshold !== undefined ? forceThreshold : 0.0005;
  if(t <= 0) return pts;
  const res = [pts[0]];
  for(let i=1; i<pts.length; i++) {
    if(calcDist(res[res.length-1].lat, res[res.length-1].lng, pts[i].lat, pts[i].lng) > t) res.push(pts[i]);
  }
  if(res[res.length-1] !== pts[pts.length-1]) res.push(pts[pts.length-1]);
  return res;
}
function parseGPX(t){
  const p=[],r=/<trkpt[^>]*lat="([^"]+)"[^>]*lon="([^"]+)"/gi; let m;
  while((m=r.exec(t))!==null) p.push({lat:+m[1],lng:+m[2]}); return simplifyPoints(p, 0.0001);
}
function parseKML(t){
  const p=[],r=/<coordinates>([\s\S]*?)<\/coordinates>/gi; let m;
  while((m=r.exec(t))!==null){ m[1].trim().split(/\s+/).forEach(s=>{ const x=s.split(','); if(x.length>=2&&!isNaN(+x[1])) p.push({lat:+x[1],lng:+x[0]}); }); }

/* ---- Route geometry codec ----
   Coordinates are the bulk of a photo-free export: ~32 bytes per point as
   {"lat":..,"lng":..} versus ~7 as an encoded polyline. Precision 5 matches the 5dp
   rounding the export already applied, so this costs nothing in accuracy. */
function encodePath(pts){
  let out='', plat=0, plng=0;
  for(const p of pts){
    const lat=Math.round(p.lat*1e5), lng=Math.round(p.lng*1e5);
    out+=encodeSignedNum(lat-plat)+encodeSignedNum(lng-plng);
    plat=lat; plng=lng;
  }
  return out;
}
function encodeSignedNum(v){
  v = v<0 ? ~(v<<1) : (v<<1);
  let out='';
  while(v>=0x20){ out+=String.fromCharCode((0x20|(v&0x1f))+63); v>>>=5; }
  return out+String.fromCharCode(v+63);
}
function decodePath(str){
  const pts=[]; let i=0, lat=0, lng=0;
  while(i<str.length){
    let b, shift=0, res=0;
    do{ b=str.charCodeAt(i++)-63; res|=(b&0x1f)<<shift; shift+=5; }while(b>=0x20);
    lat += (res&1)?~(res>>1):(res>>1);
    shift=0; res=0;
    do{ b=str.charCodeAt(i++)-63; res|=(b&0x1f)<<shift; shift+=5; }while(b>=0x20);
    lng += (res&1)?~(res>>1):(res>>1);
    pts.push({lat:lat/1e5, lng:lng/1e5});
  }
  return pts;
}

function safeUrl(u){

  if(/^[a-z][a-z0-9+.-]*:/i.test(s)) return 'https://'+s.replace(/^[a-z][a-z0-9+.-]*:\/*/i,'');
  return 'https://'+s.replace(/^\/+/,'');

function ytId(url){

  if(m) return m[1];
  if(/^[A-Za-z0-9_-]{11}$/.test(s)) return s; // a bare video id
  return '';
}

  list.innerHTML=linksData.length?'':'<div style="color:#666;font-size:12px;font-style:italic;text-align:center">No links added yet.</div>';
  linksData.forEach(l=>{
    const c=document.createElement('div'); c.className='card';
    c.innerHTML='<div class="card-meta"><span style="color:'+(LINK_ICONS[l.icon]||LINK_ICONS.link).color+'">'+(LINK_ICONS[l.icon]||LINK_ICONS.link).label+'</span>'
      +'<button class="btn" style="padding:2px 6px;font-size:10px;background:#441111;color:#ff4444" onclick="removeLink('+l.id+')">Delete</button></div>'
      +'<label style="font-size:10px;color:#888">Platform</label>'
      +'<select id="link-icon-'+l.id+'" class="btn" style="width:100%;background:#222;border-color:#555;outline:none;margin-bottom:6px;font-family:\'WRC Clean Roman\',sans-serif;">'
      + Object.keys(LINK_ICONS).map(function(k){ return '<option value="'+k+'"'+(l.icon===k?' selected':'')+'>'+LINK_ICONS[k].label+'</option>'; }).join('')
      +'</select>'
      +'<label style="font-size:10px;color:#888">Button text <span style="color:#555">(blank = icon only)</span></label>'
      +'<input type="text" id="link-label-'+l.id+'" placeholder="e.g. Follow us" value="'+escHtml(l.label)+'">'
      +'<label style="font-size:10px;color:#888">URL</label>'
      +'<input type="text" id="link-url-'+l.id+'" placeholder="instagram.com/yourname" value="'+escHtml(l.url)+'">'
      +'<div style="margin-top:8px;padding:8px;background:#101010;border-radius:4px;display:flex;justify-content:center" id="link-preview-'+l.id+'"></div>';
    list.appendChild(c);
    const paint=()=>{ document.getElementById('link-preview-'+l.id).innerHTML='<div class="slink-preview">'+linkBtnHtml(l)+'</div>'; };
    paint();
    document.getElementById('link-icon-'+l.id).addEventListener('change', e=>{ l.icon=e.target.value; renderLinks(); });
    document.getElementById('link-label-'+l.id).addEventListener('input', e=>{ l.label=e.target.value; paint(); });
    document.getElementById('link-url-'+l.id).addEventListener('input', e=>{ l.url=e.target.value; paint(); });
  });
}

/* Angle of travel in screen space — Mercator is conformal, so this is zoom-invariant.
   project() at a fixed high zoom, since latLngToLayerPoint() rounds to whole pixels. */
function routeAngle(a, b){
  const p1=map.project(a,18), p2=map.project(b,18);
  return Math.atan2(p2.y-p1.y, p2.x-p1.x)*180/Math.PI;
}
/* Split points read as a gate across the road rather than a dot floating on it. */
function splitTickIcon(a, b){
  return L.divIcon({className:'',html:'<div style="width:20px;height:20px;display:flex;align-items:center;justify-content:center;transform:rotate('+routeAngle(a,b).toFixed(1)+'deg)"><div style="width:3.5px;height:15px;background:#141414;border-radius:1px;box-shadow:0 0 0 1.5px rgba(255,255,255,.95)"></div></div>',iconSize:[20,20],iconAnchor:[10,10]});
}

/* ---- Render ---- */
function renderUI(){
  hideHover();
  renderLinks();
  renderStages();
  mapLayers.forEach(l=>map.removeLayer(l)); mapLayers=[]; sectorLayers={}; poiLayers={};
  if(!fullTrackCoords.length){ if(typeof relayoutPanes==='function') relayoutPanes(); return; }

  const allLL=fullTrackCoords.map(p=>[p.lat,p.lng]);
  const bgLine=L.polyline(allLL,{color:'#fff',weight:12,opacity:0.01}).addTo(map); mapLayers.push(bgLine);
  bgLine.on('click',function(e){
    if(!isSplitMode) return;
    let mi=Infinity,ci=0;
    fullTrackCoords.forEach((pt,idx)=>{ const d=map.distance(e.latlng,[pt.lat,pt.lng]); if(d<mi){mi=d;ci=idx;} });
    if(splitIndices.some(x=>Math.abs(x-ci)<10)){showError("Too close to existing split.");return;}
    splitIndices.push(ci); splitIndices.sort((a,b)=>a-b); rebuildSectors();
  });

  // Start / Finish
  const sp=fullTrackCoords[0], fp=fullTrackCoords[fullTrackCoords.length-1];
  const mkSF=(html)=>L.divIcon({className:'',html,iconSize:[18,18],iconAnchor:[9,9]});
  mapLayers.push(L.marker([sp.lat,sp.lng],{icon:mkSF('<div style="background:#4caf50;color:#fff;width:18px;height:18px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:bold;box-shadow:0 0 8px rgba(0,0,0,.6)">S</div>'),interactive:false,zIndexOffset:1000}).addTo(map));
  mapLayers.push(L.marker([fp.lat,fp.lng],{icon:mkSF('<div style="background:#fff;color:#000;width:18px;height:18px;border-radius:50%;border:2px solid #000;display:flex;align-items:center;justify-content:center;font-size:9px;box-shadow:0 0 8px rgba(0,0,0,.6)">🏁</div>'),interactive:false,zIndexOffset:1000}).addTo(map));

  // Sector lines
  sectorsData.forEach(sec=>{
    const ll=sec.coords.map(p=>[p.lat,p.lng]);
    const glow=L.polyline(ll,{color:sec.color,weight:7.5,opacity:0.9,lineCap:'round',lineJoin:'round',interactive:false}).addTo(map);
    const core=L.polyline(ll,{color:'#ffffff',weight:3,opacity:1, lineCap:'round',lineJoin:'round',interactive:false}).addTo(map);
    const hit =L.polyline(ll,{color:'transparent',weight:30,opacity:0,lineCap:'round',lineJoin:'round',interactive:true}).addTo(map);
    sectorLayers[sec.id]={core,glow,hit};

    // Use native mousemove events — the hit line just moves the DOM div
    hit.on('mouseover',  e=>{ if(!isSplitMode&&selectedSectorId!==sec.id){ glow.setStyle({weight:10,opacity:1}); core.setStyle({weight:4}); } if(!isSplitMode) showHover(e.originalEvent,sec); });
    hit.on('mousemove',  e=>{ if(!isSplitMode) moveHover(e.originalEvent); });
    hit.on('touchstart', e=>{ if(!isSplitMode){ showHover(e.originalEvent,sec); moveHover(e.originalEvent); }});
    hit.on('touchmove',  e=>{ if(!isSplitMode) moveHover(e.originalEvent); });
    hit.on('touchend',   e=>{ L.DomEvent.stopPropagation(e.originalEvent); if(!isSplitMode) hideHover(); });
    hit.on('mouseout',   ()=>{ if(!isSplitMode&&selectedSectorId!==sec.id){ glow.setStyle({weight:7.5,opacity:(selectedSectorId===null)?0.9:0.3}); core.setStyle({weight:3}); } hideHover(); });
    hit.on('click', e=>{ L.DomEvent.stopPropagation(e.originalEvent); if(isSplitMode){bgLine.fire('click',e);}else{hideHover();selectSector(sec.id);map.fitBounds(core.getBounds(),{padding:[40,40]});} });

    mapLayers.push(glow,core,hit);
    if(sec.startIdx!==0 && ll.length>1){ const m=L.marker(ll[0],{icon:splitTickIcon(ll[0],ll[Math.min(3,ll.length-1)]),interactive:false,zIndexOffset:600}).addTo(map); mapLayers.push(m); }
  });

  // POIs — these use a standard Leaflet tooltip anchored to the marker point, which is correct for fixed points
  poisData.forEach(poi=>{
    const pt=getLatLngAtKm(parseFloat(poi.km)||0);
    const mk=L.marker([pt.lat,pt.lng],{icon:poiDivIcon(poi.icon),zIndexOffset:700}).addTo(map);
    const html=buildPoiTooltipHtml(poi);
    const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    if (!isTouch) {
        mk.bindTooltip(html,{className:'poi-tt',direction:'top',offset:[0,-12],permanent:false});
    } else {
        mk.bindPopup(html,{className:'poi-tt',closeButton:false,offset:[0,-12],autoPan:false});
        mk.on('click', e=>{ L.DomEvent.stopPropagation(e.originalEvent); mk.openPopup(); });
    }
    poiLayers[poi.id]=mk;
    mapLayers.push(mk);
  });

  // Sidebar sectors
  const list=document.getElementById('sectors-list'); list.innerHTML='';
  sectorsData.forEach((sec,i)=>{
    const card=document.createElement('div'); card.className='card'; card.id=`card-${sec.id}`;
    const mergeBtn=i>0?`<button class="btn" style="padding:2px 6px;font-size:10px;" onclick="removeSplit(${sec.startIdx})">Merge Up</button>`:'';
    var secClearBtn = sec.photo ? '<button class="btn" style="padding:3px 6px;font-size:10px;background:#441111;color:#ff4444;" onclick="clearSectorPhoto('+sec.id+')">✕</button>' : '';
    card.innerHTML = '<div class="card-meta"><span style="color:'+sec.color+'">Sector '+(i+1)+'</span>'
      + '<div style="display:flex;align-items:center;gap:8px"><span>'+sec.dist+' km</span>'
      + '<input type="color" class="color-picker" id="color-'+sec.id+'" value="'+sec.color+'">'+mergeBtn+'</div></div>'
      + '<input type="text" id="name-'+sec.id+'" value="'+sec.name.replace(/"/g,'&quot;')+'">'
      + '<textarea id="desc-'+sec.id+'" style="min-height:30px;margin-bottom:8px;">'+sec.desc+'</textarea>'
      + '<label style="font-size:10px;color:#888;display:block;margin-bottom:4px;">Photo (optional)</label>'
      + '<div style="display:flex;gap:6px;align-items:center;">'
      + '<input type="file" accept="image/*" id="sec-photo-input-'+sec.id+'" style="display:none">'
      + '<button class="btn" style="padding:3px 8px;font-size:11px;" onclick="document.getElementById(\'sec-photo-input-'+sec.id+'\').click()">📷 Upload</button>'
      + '<span id="sec-photo-name-'+sec.id+'" style="font-size:11px;color:#888;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+(sec.photo ? 'Photo attached' : 'No photo')+'</span>'
      + secClearBtn
      + '</div>'
      + '<label style="font-size:10px;color:#888;display:block;margin:8px 0 4px;">YouTube video (optional)</label>'
      + '<input type="text" id="vid-sec-'+sec.id+'" placeholder="https://youtu.be/..." value="'+escHtml(sec.video||'')+'">'
      + '<div id="vidchip-sec-'+sec.id+'" style="display:flex;align-items:center;min-height:18px;">'+ytChipHtml(sec.video)+'</div>';
    list.appendChild(card);
    document.getElementById(`vid-sec-${sec.id}`).addEventListener('input', e=>{
      sec.video=e.target.value;
      document.getElementById(`vidchip-sec-${sec.id}`).innerHTML=ytChipHtml(sec.video);
    });

    document.getElementById(`color-${sec.id}`).addEventListener('change', e=>{ sec.color=e.target.value; if(sectorLayers[sec.id]) sectorLayers[sec.id].glow.setStyle({color:sec.color}); });
    document.getElementById(`name-${sec.id}`).addEventListener('input',  e=>{ sec.name=e.target.value; });
    document.getElementById(`desc-${sec.id}`).addEventListener('input',  e=>{ sec.desc=e.target.value; });
    document.getElementById(`sec-photo-input-${sec.id}`).addEventListener('change', e=>{
      const file=e.target.files[0]; if(!file) return;
      const reader=new FileReader();
      reader.onload=async function(ev){
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let w = img.width, h = img.height; const max = 900;
            if(w > max || h > max) { if(w > h) { h = Math.round(h * max / w); w = max; } else { w = Math.round(w * max / h); h = max; } }
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            sec.photo = canvas.toDataURL('image/jpeg', 0.88);
          document.getElementById(`sec-photo-name-${sec.id}`).textContent='Photo attached';
          renderUI();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    card.addEventListener('click', e=>{ if(isSplitMode||['INPUT','TEXTAREA','BUTTON'].includes(e.target.tagName)) return; selectSector(sec.id); if(sectorLayers[sec.id]) map.fitBounds(sectorLayers[sec.id].core.getBounds(),{padding:[40,40]}); });
    card.addEventListener('mouseenter', ()=>{ if(!isSplitMode&&selectedSectorId!==sec.id&&sectorLayers[sec.id]){ sectorLayers[sec.id].glow.setStyle({weight:10,opacity:1}); sectorLayers[sec.id].core.setStyle({weight:4}); } });
    card.addEventListener('mouseleave', ()=>{ if(!isSplitMode&&selectedSectorId!==sec.id&&sectorLayers[sec.id]){ sectorLayers[sec.id].glow.setStyle({weight:7.5,opacity:(selectedSectorId===null)?0.9:0.3}); sectorLayers[sec.id].core.setStyle({weight:3}); } });
  });


  // Render Merged Stages (background visuals only)
  mergedSectors.forEach(sec=>{
    const ll=sec.coords.map(p=>[p.lat,p.lng]);
    const glow = L.polyline(ll,{color:sec.color,weight:7,opacity:0.4,lineCap:'round',lineJoin:'round',interactive:false}).addTo(map);
    const core = L.polyline(ll,{color:'#aaa',weight:2.5,opacity:0.8,lineCap:'round',lineJoin:'round',interactive:false}).addTo(map);
    const hit=L.polyline(ll,{color:'transparent',weight:30,opacity:0,lineCap:'round',lineJoin:'round',interactive:true}).addTo(map);
    hit.on('mouseover',e=>showHover(e.originalEvent,sec)); hit.on('mousemove',e=>moveHover(e.originalEvent)); hit.on('mouseout',()=>hideHover());
    mapLayers.push(glow, core, hit);
    
    // Add start and finish for merged
    if(sec.id===0) {
      mapLayers.push(L.marker(ll[0],{icon:L.divIcon({className:'',html:'<div style="background:#4caf50;color:#fff;width:14px;height:14px;border-radius:50%;border:1.5px solid #fff;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:bold;opacity:0.8">S</div>',iconSize:[14,14],iconAnchor:[7,7]}),interactive:false}).addTo(map));
      const label=sec.stageLabel || sec.name || 'Stage';
      mapLayers.push(L.marker(ll[0],{icon:L.divIcon({className:'stage-label',html:'<div style="display:inline-block;overflow:visible;background:rgba(10,10,10,.9);color:#fff;border-left:3px solid #fc4d03;border-radius:2px;padding:3px 6px;white-space:nowrap;font-family:WRC Clean Bold,sans-serif;font-size:10px;box-shadow:0 2px 5px rgba(0,0,0,.55)">'+label+'</div>',iconSize:[300,28],iconAnchor:[-13,28]}),interactive:false,zIndexOffset:850}).addTo(map));
    }

    // Check if this is the last sector of a stage (either last in array, or next is id 0)
    const nextIdx = mergedSectors.indexOf(sec) + 1;
    if (nextIdx === mergedSectors.length || mergedSectors[nextIdx].id === 0) {
       mapLayers.push(L.marker(ll[ll.length-1],{icon:L.divIcon({className:'',html:'<div style="background:#fff;color:#000;width:14px;height:14px;border-radius:50%;border:1.5px solid #000;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:bold;opacity:0.8">🏁</div>',iconSize:[14,14],iconAnchor:[7,7]}),interactive:false}).addTo(map));
    }

  });

  mergedPois.forEach(poi=>{
    const mk=L.marker([poi.lat, poi.lng],{icon:poiDivIcon(poi.icon,true),zIndexOffset:650}).addTo(map);
    mk.bindTooltip(buildPoiTooltipHtml(poi),{className:'poi-tt',direction:'top',offset:[0,-12],permanent:false});
    mapLayers.push(mk);
  });

  // Sidebar POIs
  const poiList=document.getElementById('pois-list');
  poiList.innerHTML=poisData.length?'':`<div style="color:#666;font-size:12px;font-style:italic;text-align:center">No spots added yet.</div>`;
  poisData.forEach(poi=>{
    const c=document.createElement('div'); c.className='card';
    var clearBtn = poi.photo ? '<button class="btn" style="padding:3px 6px;font-size:10px;background:#441111;color:#ff4444;" onclick="clearPoiPhoto('+poi.id+')">✕</button>' : '';
    c.innerHTML = '<div class="card-meta"><span style="color:#ffcc00">Spot Marker</span><button class="btn" style="padding:2px 6px;font-size:10px;background:#441111;color:#ff4444" onclick="removePoi('+poi.id+')">Delete</button></div>'
      + '<div class="flex-row">'
      + '<div style="flex:0.4"><label style="font-size:10px;color:#888">KM</label><input type="number" step="0.1" min="0" max="'+totalTrackDist+'" id="poi-km-'+poi.id+'" value="'+poi.km+'"></div>'
      + '<div style="flex:1"><label style="font-size:10px;color:#888">Title</label><input type="text" id="poi-title-'+poi.id+'" value="'+poi.title.replace(/"/g,'&quot;')+'"></div>'
      + '</div>'
      + '<label style="font-size:10px;color:#888;display:block;margin-bottom:4px;">Icon</label>'
      + '<div style="display:flex;gap:6px;align-items:center;margin-bottom:8px;">'
      + '<span id="poi-icon-preview-'+poi.id+'" style="flex:0 0 auto;display:flex">'+poiPinHtml(poi.icon)+'</span>'
      + '<select id="poi-icon-'+poi.id+'" class="btn" style="flex:1;background:#222;border-color:#555;outline:none;font-family:\'WRC Clean Roman\',sans-serif;">'
      + Object.keys(POI_ICONS).map(function(k){ return '<option value="'+k+'"'+((poi.icon||'spot')===k?' selected':'')+'>'+POI_ICONS[k].label+'</option>'; }).join('')
      + '</select></div>'
      + '<textarea placeholder="Description" id="poi-desc-'+poi.id+'" style="min-height:30px;margin-top:0">'+poi.desc+'</textarea>'
      + '<label style="font-size:10px;color:#888;display:block;margin-bottom:4px;">Photo (optional)</label>'
      + '<div style="display:flex;gap:6px;align-items:center;">'
      + '<input type="file" accept="image/*" id="poi-photo-input-'+poi.id+'" style="display:none">'
      + '<button class="btn" style="padding:3px 8px;font-size:11px;" onclick="document.getElementById(\'poi-photo-input-'+poi.id+'\').click()">📷 Upload</button>'
      + '<span id="poi-photo-name-'+poi.id+'" style="font-size:11px;color:#888;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+(poi.photo ? 'Photo attached' : 'No photo')+'</span>'
      + clearBtn
      + '</div>'
      + '<label style="font-size:10px;color:#888;display:block;margin:8px 0 4px;">YouTube video (optional)</label>'
      + '<input type="text" id="vid-poi-'+poi.id+'" placeholder="https://youtu.be/..." value="'+escHtml(poi.video||'')+'">'
      + '<div id="vidchip-poi-'+poi.id+'" style="display:flex;align-items:center;min-height:18px;">'+ytChipHtml(poi.video)+'</div>';
    poiList.appendChild(c);
    document.getElementById(`vid-poi-${poi.id}`).addEventListener('input', e=>{
      poi.video=e.target.value;
      document.getElementById(`vidchip-poi-${poi.id}`).innerHTML=ytChipHtml(poi.video);
      if(poiLayers[poi.id]) poiLayers[poi.id].setTooltipContent(buildPoiTooltipHtml(poi));
    });
    document.getElementById(`poi-km-${poi.id}`).addEventListener('input', e=>{ poi.km=e.target.value; const pt=getLatLngAtKm(parseFloat(poi.km)||0); if(poiLayers[poi.id]) poiLayers[poi.id].setLatLng([pt.lat,pt.lng]); });
    document.getElementById(`poi-title-${poi.id}`).addEventListener('input', e=>{ poi.title=e.target.value; if(poiLayers[poi.id]) poiLayers[poi.id].setTooltipContent(buildPoiTooltipHtml(poi)); });
    document.getElementById(`poi-icon-${poi.id}`).addEventListener('change', e=>{
      poi.icon=e.target.value;
      document.getElementById(`poi-icon-preview-${poi.id}`).innerHTML=poiPinHtml(poi.icon);
      if(poiLayers[poi.id]){ poiLayers[poi.id].setIcon(poiDivIcon(poi.icon)); poiLayers[poi.id].setTooltipContent(buildPoiTooltipHtml(poi)); }
    });
    document.getElementById(`poi-desc-${poi.id}`).addEventListener('input', e=>{ poi.desc=e.target.value; if(poiLayers[poi.id]){const h=buildPoiTooltipHtml(poi);poiLayers[poi.id].setTooltipContent(h);} });
    document.getElementById(`poi-photo-input-${poi.id}`).addEventListener('change', e=>{
      const file=e.target.files[0]; if(!file) return;
      const reader=new FileReader();
      reader.onload=async function(ev){
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let w = img.width, h = img.height; const max = 900;
            if(w > max || h > max) { if(w > h) { h = Math.round(h * max / w); w = max; } else { w = Math.round(w * max / h); h = max; } }
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            poi.photo = canvas.toDataURL('image/jpeg', 0.88);
          document.getElementById(`poi-photo-name-${poi.id}`).textContent='Photo attached';
          if(poiLayers[poi.id]) poiLayers[poi.id].setTooltipContent(buildPoiTooltipHtml(poi));
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });
  });

  selectSector(selectedSectorId);
  if(typeof relayoutPanes==='function') relayoutPanes(); // Stage Order panel may have just appeared
}


/* ---- View counting ----
   GoatCounter: one script in the exported map, no cookies and nothing to consent to. The
   path is fixed per rally so a map keeps its own row however many times it is re-exported,
   rather than counting under whatever path the host page happens to sit at. */
let analyticsCode='dimi-wrc';          // the site's own GoatCounter code; clear the box for no counter
function setAnalyticsCode(v){
  analyticsCode=String(v||'').trim()
    .replace(/^https?:\/\//,'')
    .replace(/\.goatcounter\.com.*$/,'')
    .replace(/\/.*$/,'')
    .replace(/[^A-Za-z0-9-]/g,'')
    .toLowerCase();
  const el=document.getElementById('gc-code');
  if(el && el.value!==analyticsCode) el.value=analyticsCode;
}
function analyticsPath(){
  const bits=[stageMeta.rally||'', stageMeta.year||''].join(' ').trim() || 'stage map';
  return 'stage-map/'+bits.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
}

/* ---- Logo ----
   The mark in the bottom-right corner of the exported map. Any image can take the place of
   the built-in one. It is resized as a PNG rather than run through the photo compressor,

/* A logo drawn in flat black - most press kits ship one - is turned into a white version so
   it reads on a dark map: a solid white background is dropped, and what is left becomes
   white with its edges kept soft. Artwork that carries real colour is left alone. */
function whitenLogo(canvas){
  const ctx=canvas.getContext('2d'), w=canvas.width, h=canvas.height;
  const img=ctx.getImageData(0,0,w,h), d=img.data;
  const at=function(x,y){ const i=(y*w+x)*4; return {r:d[i],g:d[i+1],b:d[i+2],a:d[i+3]}; };
  const corners=[at(0,0),at(w-1,0),at(0,h-1),at(w-1,h-1)];
  const onWhite=corners.every(function(c){ return c.a>250 && c.r>=235 && c.g>=235 && c.b>=235; });
  let opaque=0, lumSum=0, satSum=0, hasAlpha=false;
  for(let i=0;i<d.length;i+=4){
    if(d[i+3]<250) hasAlpha=true;
    if(d[i+3]<8) continue;
    const mx=Math.max(d[i],d[i+1],d[i+2]), mn=Math.min(d[i],d[i+1],d[i+2]);
    if(onWhite && mx>=235 && mn>=235) continue;    // the background is not the artwork
    opaque++;
    lumSum+=(0.299*d[i]+0.587*d[i+1]+0.114*d[i+2]);
    satSum+=(mx?(mx-mn)/mx:0);
  }
  if(!opaque) return false;
  const lum=lumSum/opaque, sat=satSum/opaque;
  if(sat>0.18) return false;                       // real colour in there - leave it alone
  if(lum>150) return false;                        // already light artwork
  if(onWhite){
    // ink on a solid background: the ink becomes the shape, so the edges stay soft
    for(let i=0;i<d.length;i+=4){
      const l=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
      d[i]=255; d[i+1]=255; d[i+2]=255;
      d[i+3]=Math.max(0, Math.min(255, Math.round(255-l)));
    }
  } else {
    for(let i=0;i<d.length;i+=4){ d[i]=255; d[i+1]=255; d[i+2]=255; }   // keep the alpha it came with
  }
  ctx.putImageData(img,0,0);
  return true;
}
document.getElementById('logo-input').addEventListener('change', function(e){
  const file=e.target.files[0]; e.target.value='';
  if(!file) return;
  const reader=new FileReader();
  reader.onload=function(ev){
    const src=String(ev.target.result);
    if(/^data:image\/svg/.test(src)){ logoData=src; logoWhitened=false; updateLogoBtn(); return; }
    const img=new Image();
    img.onload=function(){
      const max=600; let w=img.width, h=img.height;
      if(w>max||h>max){ if(w>h){ h=Math.round(h*max/w); w=max; } else { w=Math.round(w*max/h); h=max; } }
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      logoWhitened=whitenLogo(c);
      logoData=c.toDataURL('image/png');
      updateLogoBtn();
    };
    img.onerror=function(){ showError('Could not read that image.'); };
    img.src=src;
  };
  reader.readAsDataURL(file);
});
document.addEventListener('DOMContentLoaded', updateLogoBtn);

function saveProject() {
  if(!sectorsData.length) return;
  updateStageMeta();
  const proj = { fullTrackCoords, splitIndices, sectorsData, poisData, totalTrackDist, cumulativeDistances, mergedSectors, mergedPois, stageMeta, linksData, logoData, logoWhitened, analyticsCode, mainStagePos, showFullscreen: wantsFullscreenBtn() };
  const blob = new Blob([JSON.stringify(proj)], {type:'application/json'});
  const url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = 'stage_project.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

document.getElementById('merge-input').addEventListener('change', async function(e){
  const files = Array.from(e.target.files);
  if(!files.length) return;

  let successCount = 0;
  for(let i=0; i<files.length; i++){
    const file = files[i];
    const ext = file.name.split('.').pop().toLowerCase();
    if(ext !== 'html') { showError("Merge only supports .html files."); continue; }

    try {
      const textData = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = ev => resolve(ev.target.result);
        reader.onerror = err => reject(err);
        reader.readAsText(file);
      });

      const sMatch = textData.match(/const sectors=(\[[\s\S]*?\]);/);
      const pMatch = textData.match(/const pois=(\[[\s\S]*?\]);/);

      if(sMatch && pMatch) {
        const mSects = inflateSectors(JSON.parse(sMatch[1]));
        const mPois = JSON.parse(pMatch[1]);
        const metaMatch = textData.match(/const stageMeta=(\{[\s\S]*?\});/);
        const importedMeta = metaMatch ? JSON.parse(metaMatch[1]) : {};
        const importedLabel = [importedMeta.number, importedMeta.name].filter(Boolean).join(' · ') || file.name.replace(/\.html$/i,'');
        mSects.forEach(sec => { sec.stageMeta = sec.stageMeta || importedMeta; sec.stageLabel = sec.stageLabel || importedLabel; });

        let tempCoords = []; let tempCumDist = [0]; let tempDist = 0;
        mSects.forEach((sec, idx) => { sec.coords.forEach((c, j) => { if(idx > 0 && j === 0) return; tempCoords.push(c); }); });
        for(let k=1; k<tempCoords.length; k++) {
            tempDist += calcDist(tempCoords[k-1].lat, tempCoords[k-1].lng, tempCoords[k].lat, tempCoords[k].lng);
            tempCumDist.push(tempDist);
        }
        const getTempPt = (km) => {
            if(km<=0) return tempCoords[0];
            if(km>=tempDist) return tempCoords[tempCoords.length-1];
            for(let k=0; k<tempCumDist.length-1; k++) {
                if(km>=tempCumDist[k] && km<=tempCumDist[k+1]) {
                    let seg = tempCumDist[k+1]-tempCumDist[k]; let r = seg ? (km-tempCumDist[k])/seg : 0;
                    return { lat: tempCoords[k].lat+(tempCoords[k+1].lat-tempCoords[k].lat)*r, lng: tempCoords[k].lng+(tempCoords[k+1].lng-tempCoords[k].lng)*r };
                }
            }
            return tempCoords[tempCoords.length-1];
        };

        mPois.forEach(p => {
            if(!p.lat || !p.lng) { let pt = getTempPt(parseFloat(p.km)||0); p.lat = pt.lat; p.lng = pt.lng; }
            p.isMerged = true;
        });

        mergedSectors = mergedSectors.concat(mSects);
        mergedPois = mergedPois.concat(mPois);
        mergedCount++;
        successCount++;
      } else {
        showError("Could not find stage data in " + file.name);
      }
    } catch(err) {
      showError("Error reading " + file.name + ": " + err.message);
    }
  }

  if(successCount > 0) {
    await compressAllLoadedPhotos();
    renderUI();
    document.getElementById('export-btn').disabled = false;
    document.getElementById('preview-btn').disabled = false;
    alert(`Merged ${successCount} stage(s)! Map now contains ${mergedCount} total extra stage(s).`);
  }
  e.target.value = '';
});

document.getElementById('file-input').addEventListener('change', function(e){
  const file=e.target.files[0]; if(!file) return;
  const ext=file.name.split('.').pop().toLowerCase(); const reader=new FileReader();
  reader.onload=async function(ev){
    try{
      const text=ev.target.result;
      if(ext==='json') {
        const p = JSON.parse(text);
        fullTrackCoords=p.fullTrackCoords||[]; splitIndices=p.splitIndices||[]; sectorsData=p.sectorsData||[]; poisData=p.poisData||[]; 
        totalTrackDist=p.totalTrackDist||0; cumulativeDistances=p.cumulativeDistances||[];
        mergedSectors=p.mergedSectors||[]; mergedPois=p.mergedPois||[]; stageMeta=p.stageMeta||stageMeta; fillStageMeta();
        linksData=p.linksData||[]; linkIdCounter=linksData.reduce((m,l)=>Math.max(m,(l.id||0)+1),0);
        mainStagePos=p.mainStagePos||0;
        logoData=p.logoData||''; logoWhitened=!!p.logoWhitened; updateLogoBtn();
        setAnalyticsCode(p.analyticsCode===undefined?'dimi-wrc':p.analyticsCode);
        setFullscreenBtnOption(p.showFullscreen!==false);
      }
      else if(ext==='html') {
        const sMatch = text.match(/const sectors=(\[[\s\S]*?\]);/);
        const pMatch = text.match(/const pois=(\[[\s\S]*?\]);/);
        if(!sMatch || !pMatch) { showError("Could not parse HTML stage data."); return; }
        const mSects = inflateSectors(JSON.parse(sMatch[1])); const mPois = JSON.parse(pMatch[1]);
        const metaMatch = text.match(/const stageMeta=(\{[\s\S]*?\});/);
        const importedMeta = metaMatch ? JSON.parse(metaMatch[1]) : {};
        const importedLabel = [importedMeta.number, importedMeta.name].filter(Boolean).join(' · ') || file.name.replace(/\.html$/i,'');
        mSects.forEach(sec => { sec.stageMeta = sec.stageMeta || importedMeta; sec.stageLabel = sec.stageLabel || importedLabel; });
        if(importedMeta && Object.keys(importedMeta).length) { stageMeta={...stageMeta,...importedMeta}; fillStageMeta(); }
        const lMatch = text.match(/const links=(\[[\s\S]*?\]);/);
        if(lMatch){ try{ linksData=JSON.parse(lMatch[1]).map((l,i)=>({id:i,label:l.label||'',url:l.url||'',icon:l.icon||'link'})); linkIdCounter=linksData.length; }catch(_){} }
        setFullscreenBtnOption(/id="fs-btn"/.test(text)); // keep the exported map's fullscreen setting on re-import

        // --- NEW: Recalculate lat/lng for old HTML POIs that lack it! ---
        // First, build a continuous track for THIS specific HTML file
        let tempCoords = []; let tempCumDist = [0]; let tempDist = 0;
        mSects.forEach((sec, i) => {
            sec.coords.forEach((c, j) => {
                if(i > 0 && j === 0) return;
                tempCoords.push(c);
            });
        });
        for(let i=1; i<tempCoords.length; i++) {
            tempDist += calcDist(tempCoords[i-1].lat, tempCoords[i-1].lng, tempCoords[i].lat, tempCoords[i].lng);
            tempCumDist.push(tempDist);
        }
        function getTempPt(km) {
            if(km<=0) return tempCoords[0];
            if(km>=tempDist) return tempCoords[tempCoords.length-1];
            for(let i=0; i<tempCumDist.length-1; i++) {
                if(km>=tempCumDist[i] && km<=tempCumDist[i+1]) {
                    let seg = tempCumDist[i+1]-tempCumDist[i]; let r = seg ? (km-tempCumDist[i])/seg : 0;
                    return { lat: tempCoords[i].lat+(tempCoords[i+1].lat-tempCoords[i].lat)*r, lng: tempCoords[i].lng+(tempCoords[i+1].lng-tempCoords[i].lng)*r };
                }
            }
            return tempCoords[tempCoords.length-1];
        }
        // Fix mPois
        mPois.forEach(p => {
            if(!p.lat || !p.lng) {
                let pt = getTempPt(parseFloat(p.km)||0);
                p.lat = pt.lat; p.lng = pt.lng;
            }
        });
        // ----------------------------------------------------------------
        /* The stage that was being edited is not always the first one in the file: the Stage
           Order panel can put it anywhere, and the file's stageMeta belongs to that stage,
           not to whichever happens to come first. Taking the first group as the editable one
           stamped the wrong name on it and dragged the real stage's points onto its road.
           So: group the sectors by stage, find the group the meta actually describes, and
           remember where it sat so the running order survives the round trip. The points
           split the same way - isMerged is false only for the stage that was being edited. */
        const impGroups = []; let impCur = null;
        mSects.forEach(sec => { if(sec.id === 0 || !impCur){ impCur = []; impGroups.push(impCur); } impCur.push(sec); });
        if(!impGroups.length) { showError("No valid track found in HTML."); return; }
        let mainGi = impGroups.findIndex(g => (g[0].stageLabel || '') === importedLabel);
        if(mainGi < 0) mainGi = impGroups.findIndex(g => {
          const m = g[0].stageMeta || {};
          return (m.number || '') === (importedMeta.number || '') && (m.name || '') === (importedMeta.name || '');
        });
        if(mainGi < 0) mainGi = 0;
        const mainSects = impGroups[mainGi];
        const restSects = impGroups.filter((g,i) => i !== mainGi).reduce((acc,g) => acc.concat(g), []);
        mainStagePos = mainGi;
        if(!mainSects.length) { showError("No valid track found in HTML."); return; }

        fullTrackCoords = []; splitIndices = [0]; let currentIdx = 0;
        mainSects.forEach((sec, i) => {
            sec.coords.forEach((c, j) => {
                if(i > 0 && j === 0) return; // Skip overlapping point between sectors
                fullTrackCoords.push(c); currentIdx++;
            });
            if(i < mainSects.length - 1) splitIndices.push(currentIdx - 1);
        });
        splitIndices.push(fullTrackCoords.length - 1);
        calcCumDist();

        sectorsData = mainSects.map((sec, i) => ({
            id: i, startIdx: splitIndices[i], endIdx: splitIndices[i+1],
            name: sec.name || `Sector ${i+1}`, desc: sec.desc || '', color: sec.color || palette[i%palette.length],
            stageLabel:sec.stageLabel || importedLabel, stageMeta:sec.stageMeta || importedMeta,
            coords: sec.coords, dist: sec.dist || '0.00', photo: sec.photo || '', video: sec.video || ''
        }));
        let mainPois = []; let restPois = [];
        mPois.forEach(p => { if(p.isMerged) restPois.push(p); else mainPois.push(p); });
        // If exported from older version, try to guess
        if(mPois.length > 0 && mPois[0].isMerged === undefined) {
            mainPois = mPois; restPois = [];
        }

        poisData = mainPois.map((p, i) => ({
            id: i, km: p.km, title: p.title || 'Spot', desc: p.desc || '',
            photo: p.photo || '', lat: p.lat, lng: p.lng, icon: p.icon || 'spot', video: p.video || ''
        }));
        poiIdCounter = poisData.length;
        mergedSectors = restSects; mergedPois = restPois;
      }
      else {
        if(ext==='gpx') fullTrackCoords=parseGPX(text); else if(ext==='kml') fullTrackCoords=parseKML(text); else{showError("Please upload .gpx, .kml, .json, or .html");return;}
        if(fullTrackCoords.length<2){showError("No valid coordinates found.");return;}
        calcCumDist(); splitIndices=[0,fullTrackCoords.length-1]; poisData=[]; if(!stageMeta.name) stageMeta.name=file.name.replace(/\.[^.]+$/,''); fillStageMeta();
        mergedSectors=[]; mergedPois=[]; // Reset merged overlay on fresh load
        rebuildSectors(); 
      }
      selectedSectorId=null;
      map.fitBounds(L.latLngBounds(fullTrackCoords.map(pt=>[pt.lat,pt.lng])),{padding:[40,40]});
      ['split-mode-btn','export-btn','preview-btn','add-poi-btn','reverse-btn','save-btn'].forEach(id=>document.getElementById(id).disabled=false);
      await compressAllLoadedPhotos();
      renderUI();
    }catch(err){showError("Error: "+err.message);}
    e.target.value='';
  };
  reader.readAsText(file);
});

/* ---- Export ---- */
/* The exported map's fullscreen button is opt-in from the toolbar checkbox. */
function wantsFullscreenBtn(){ const c=document.getElementById('opt-fullscreen'); return !c || c.checked; }
function setFullscreenBtnOption(on){ const c=document.getElementById('opt-fullscreen'); if(c) c.checked=!!on; }
function sanitizeFilename(name){
  const cleaned = String(name||'').trim().replace(/[\\/:*?"<>|]+/g,'-').replace(/\s+/g,'_').replace(/^\.+/,'').slice(0,120);
  return cleaned || 'stage_embed';
}
function suggestFilename(){
  return sanitizeFilename([stageMeta.number, stageMeta.name].filter(Boolean).join('_')) || 'stage_embed';
}
function exportFilename(){
  const input=document.getElementById('export-filename');
  const raw = input.value.trim() ? input.value : suggestFilename();
  const base = sanitizeFilename(raw);
  return base.toLowerCase().endsWith('.html') ? base : base+'.html';
}
/* Building an export now re-encodes every photo, so it is async and can take a moment
   on a photo-heavy project. Lock the buttons while it runs so it cannot be double-fired. */
async function withExportBusy(label, fn){
  const btns=['export-btn','preview-btn'].map(id=>document.getElementById(id));
  const was=btns.map(b=>({disabled:b.disabled, html:b.innerHTML}));
  btns.forEach(b=>b.disabled=true);
  const self=document.getElementById(label);
  const selfWas=self.innerHTML; self.innerHTML='… Working';
  try{ return await fn(); }
  finally{ btns.forEach((b,i)=>{ b.disabled=was[i].disabled; b.innerHTML=was[i].html; }); self.innerHTML=selfWas; }
}
function fmtKB(n){ return n>=1048576 ? (n/1048576).toFixed(2)+' MB' : Math.round(n/1024)+' KB'; }
async function exportEmbed(){
  if(!sectorsData.length){showError("No data to export.");return;}
  const html=await withExportBusy('export-btn', buildEmbed);
  const blob=new Blob([html],{type:'text/html'});
  const url=URL.createObjectURL(blob),a=document.createElement('a'); a.href=url; a.download=exportFilename();
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  showNotice('Exported '+exportFilename()+' — '+fmtKB(blob.size));
}
async function previewEmbed(){
  if(!sectorsData.length){showError("No data to export.");return;}
  const html=await withExportBusy('preview-btn', buildEmbed);
  const blob=new Blob([html],{type:'text/html'});
  const url=URL.createObjectURL(blob);
  const win=window.open(url,'_blank');
  if(!win){ showError("Preview was blocked by the browser's popup blocker."); URL.revokeObjectURL(url); return; }
  // the tab needs the blob to still exist while it loads; release it afterward either way
  try{ win.addEventListener('load', ()=>URL.revokeObjectURL(url)); }catch(_){}
  setTimeout(()=>URL.revokeObjectURL(url), 15000);
}

  body,html{margin:0;padding:0;height:100%;font-family:'WRC Clean Roman',sans-serif;background:#1c1c1c;overflow:hidden;}
  #map{width:100%;height:100%;background:#0a0a0a;}
  /* Dark basemap: OSM raster tiles inverted in CSS. CARTO's dark_all now
     stamps 'API KEY REQUIRED' over keyless requests, so we build the black
     style locally instead of depending on a keyed tile service. sepia+hue-rotate
     collapses the map to a single navy hue so no stray greens survive. */
  .leaflet-layer.dark-basemap-tiles { filter: invert(1) sepia(1) hue-rotate(170deg) saturate(.75) brightness(.72) contrast(1.1); }
  /* Broadcast basemap: the same Esri imagery run through a colour matrix that keeps the
     terrain's shading and rolls it onto the navy the WRC's TV maps use. It holds luminance,
     pulls red down a little and adds a flat amount of blue - the last part is what a chain
     of multiplying filters cannot do, which is why they go purple in the highlights. The
     plain chain in front is the fallback for anything that cannot resolve url(). */
  .leaflet-layer.tv-basemap-tiles { filter: grayscale(1) sepia(1) hue-rotate(186deg) saturate(1.7) brightness(1.02); filter: url(#tv-navy); }

  .leaflet-control-attribution{background:rgba(0,0,0,.5)!important;color:#666!important;}
  .map-compass { line-height:0; filter:drop-shadow(0 2px 5px rgba(0,0,0,.6)); }
  /* The scale sits bottom-left above the social row: in the top-left stack it grew wide
     enough to run under the title card and the key. */
  .leaflet-bottom.leaflet-left { bottom:52px; left:6px; }
  body.has-switcher .leaflet-bottom.leaflet-left { bottom:calc(var(--sw-h,38px) + 62px); }
  .leaflet-control-scale { margin:0 0 0 10px!important; }
  .leaflet-control-scale-line { background:rgba(10,10,10,.78)!important; border:1px solid rgba(255,255,255,.35)!important; border-top:none!important; color:#fff!important; font-family:'WRC Clean Roman',sans-serif!important; font-size:9.5px!important; letter-spacing:.3px; line-height:1.3!important; padding:1px 5px!important; text-shadow:none!important; }
  @media(max-width:600px){
    .leaflet-bottom.leaflet-left { bottom:44px; left:2px; }
    body.has-switcher .leaflet-bottom.leaflet-left { bottom:calc(var(--sw-h,30px) + 48px); }
    .leaflet-control-scale-line { font-size:8.5px!important; }
  }
  @media(max-width:400px){ .map-compass { display:none; } }
  .leaflet-control-zoom a{background:#222!important;color:#aaa!important;border-color:#333!important;}
  #ch{position:absolute;z-index:9999;pointer-events:none;display:none;flex-direction:column;align-items:center;transform:translate(-50%,calc(-100% - 14px));}
  #ch .b{background:rgba(15,15,15,.97);border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:8px 10px;max-width:180px;white-space:normal;box-shadow:0 4px 16px rgba(0,0,0,.8);}
  #ch .t{font-weight:700;font-size:12px;margin-bottom:3px;font-family:'WRC Clean Bold',sans-serif;}
  #ch .d{font-size:11px;color:#aaa;line-height:1.3;margin-bottom:4px;}
  #ch .m{font-size:11px;color:#888;}
  #ch .m span{color:#fff;font-weight:700;}
  #ch .l{width:2px;height:14px;}
  .leaflet-tooltip.poi-tt{background:rgba(15,15,15,.97);border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:8px 10px;color:#fff;font-family:'WRC Clean Roman',sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.8);pointer-events:none;max-width:180px;white-space:normal;width:180px;}
  .leaflet-tooltip.poi-tt::before{display:none;}
  .poi-tt .t{font-weight:700;font-size:12px;margin-bottom:3px;font-family:'WRC Clean Bold',sans-serif;}
  .poi-tt .d{font-size:11px;color:#aaa;line-height:1.3;margin-bottom:4px;}
  .poi-tt .m{font-size:11px;color:#888;}
  .poi-tt .m span{color:#fff;font-weight:700;}
  @media(max-width:600px){
    #ch .b{max-width:140px;padding:6px 8px;}
    #ch .t{font-size:11px!important;}#ch .d{font-size:10px!important;}#ch .m{font-size:10px!important;}
    .leaflet-tooltip.poi-tt{max-width:140px;width:140px;padding:6px 8px;}
    .poi-tt .t{font-size:11px;}.poi-tt .d{font-size:10px;}.poi-tt .m{font-size:10px;}
  }
.leaflet-popup.poi-tt .leaflet-popup-content-wrapper { background:rgba(15,15,15,.97); border:1px solid rgba(255,255,255,.12); border-radius:6px; padding:8px; color:#fff; box-shadow:0 4px 16px rgba(0,0,0,.8); }
.leaflet-popup.poi-tt .leaflet-popup-tip-container { margin-top:-1px; }
.leaflet-popup.poi-tt .leaflet-popup-tip { background:rgba(15,15,15,.97); border:1px solid rgba(255,255,255,.12); border-top:none; border-left:none; }
.leaflet-popup.poi-tt .leaflet-popup-content { margin:0 !important; line-height:1.4; width:160px !important; font-family:'WRC Clean Roman',sans-serif; }
@media(max-width:600px){ .leaflet-popup.poi-tt .leaflet-popup-content { width:140px !important; } }

  .map-style-switcher { position: absolute; top: 10px; right: 10px; z-index: 1000; display: flex; flex-wrap: wrap; justify-content: flex-end; max-width: calc(100vw - 20px); gap: 4px; background: rgba(0,0,0,0.55); padding: 5px; border-radius: 8px; }
  .map-style-btn { background: #333; color: #ccc; border: 1px solid #555; padding: 5px 10px; border-radius: 5px; font-family: 'WRC Clean Roman', sans-serif; font-size: 11px; font-weight: 600; cursor: pointer; white-space:nowrap; }
  .map-style-btn.active { background: #fc4d03; border-color: #fc4d03; color: #fff; }
  .ms-list { display: flex; gap: 4px; }
  .ms-toggle { display: none; }
  /* On a phone the four basemap names take most of the top edge and run into the title
     card, so they fold into one button that drops the list underneath it. */
  @media(max-width:600px){
    .map-style-switcher { top:8px; right:8px; gap:3px; padding:3px; position:absolute; }
    .map-style-btn { padding:4px 6px; font-size:9px; border-radius:4px; }
    .ms-toggle { display:inline-flex; align-items:center; gap:3px; }
    /* a triangle drawn in CSS, so it cannot go missing from the embedded font */
    .ms-toggle::after { content:''; width:0; height:0; border-left:3.5px solid transparent; border-right:3.5px solid transparent; border-top:4px solid currentColor; }
    .map-style-switcher.open .ms-toggle { background:#fc4d03; border-color:#fc4d03; color:#fff; }
    .map-style-switcher.open .ms-toggle::after { border-top:0; border-bottom:4px solid currentColor; }
    .ms-list { display:none; position:absolute; top:100%; right:0; margin-top:4px; flex-direction:column; align-items:stretch; gap:3px; padding:4px; border-radius:8px; background:rgba(0,0,0,.8); box-shadow:0 6px 18px rgba(0,0,0,.6); }
    .map-style-switcher.open .ms-list { display:flex; }
    .ms-list .map-style-btn { text-align:left; padding:6px 10px; font-size:10px; }
  }
  @media(max-width:400px){
    .map-style-switcher { gap:2px; padding:2px; }
    .map-style-btn { padding:3px 5px; font-size:8px; }
    .ms-list .map-style-btn { padding:6px 9px; font-size:9.5px; }
  }
  /* Full screen control - shares the top-right cluster with the basemap buttons */
  .map-fs-btn { display:flex; align-items:center; justify-content:center; padding:5px 8px; }
  .map-fs-btn:hover { background:#444; color:#fff; }
  .map-fs-btn.active { background:#fc4d03; border-color:#fc4d03; color:#fff; }
  .map-fs-btn svg { display:block; }
  @media(max-width:600px){ .map-fs-btn { padding:4px 6px; } }
  @media(max-width:400px){ .map-fs-btn { padding:3px 5px; } }
  #fs-toast { position:absolute; left:50%; bottom:14px; transform:translateX(-50%); z-index:1400; max-width:80vw; padding:7px 12px; border-radius:6px; background:rgba(10,10,10,.95); border:1px solid rgba(255,255,255,.18); color:#eee; font-family:'WRC Clean Roman',sans-serif; font-size:11px; line-height:1.35; text-align:center; opacity:0; pointer-events:none; transition:opacity .25s ease; }
  #fs-toast.show { opacity:1; }
  /* Native fullscreen sizes <html> to the screen; keep Leaflet filling it. */
  :fullscreen #map { width:100%; height:100%; }
  :-webkit-full-screen #map { width:100%; height:100%; }

window.poiMarkers=[]; window.poiData=[];
/* Opening a point's panel is done in one place, because a point can be clicked either on its

window.openPoiCallout=function(pi, pinEl, pinned, at){
  const poi=pois[pi];

  if(pinned && calloutKey()==='poi'+pi && calloutPinned()){ closeCallout(); return; }
  // the optional position lets a fanned copy of a pin speak from where it is sitting rather
  // than from the spot underneath it, so the leader comes out of the pin being pointed at
  openCallout('poi'+pi, at||[poi.lat,poi.lng], window.poiData[pi], {pin:pinEl||null, pinned:!!pinned});
};
pois.forEach((poi,pi)=>{
  const pt = [poi.lat, poi.lng];
  const mk=L.marker(pt,{icon:poiDivIcon(poi.icon,poi.isMerged),zIndexOffset:poi.isMerged?650:700}).addTo(map); window.poiMarkers.push(mk);
  const pic=POI_ICONS[poi.icon]||POI_ICONS.spot;

    metaHtml:'Mark <span>'+poi.km+' km</span>', photo:poi.photo, video:poi.video, videoTitle:poi.title };
  window.poiData[pi]=poiData;

  if(!isTouch){
    mk.on(\'mouseover\',function(){ calloutHold(); openCallout('poi'+pi,[poi.lat,poi.lng],poiData,{pin:poiPin()}); });
    mk.on(\'mouseout\', calloutRelease);
  }
  mk.on(\'click\',function(e){
    stopMapClick(e);
    if(calloutKey()==='poi'+pi && calloutPinned()){ closeCallout(); return; }

/* ---- Stacked points ----
   Several things often happened at the same corner, and at most zooms those pins land on top
   of each other. Points that close together are gathered behind one pin carrying a count;
   hovering or clicking it fans them out on short leaders so each can be reached, and anything
   that moves the map puts them back. A fan opened by hovering folds away again once the cursor
   has left it; one opened by a click stays. Which points are on the map at all is the key's
   business - this only decides how the ones that are showing get arranged. */
const STACK_PX=20;                 // how close two pins must be to count as the same spot
let stackMarkers=[], fanGroup=null, fanSticky=false, fanHideT=0;
function stackIconHtml(key,n){
  const ic=POI_ICONS[key]||POI_ICONS.spot;
  return '<div class="poi-pin" style="--pc:'+ic.color+'">'
    +'<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="'+ic.color+'" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" style="color:'+ic.color+'">'+ic.path+'</svg>'
    +'<span class="poi-count">'+n+'</span></div>';
}
function collapseFan(){
  clearTimeout(fanHideT);

  const root=document.getElementById('poi-fan');
  if(root){ root.innerHTML=''; root.classList.remove('on'); }
}
function fanHasCallout(){
  const k=calloutKey();

}
/* Same idea as the callout's hold and release: the delay is what lets the cursor cross from

   as long as it is showing, so its leader always has a pin to come out of. */
function fanHold(){ clearTimeout(fanHideT); }
function fanRelease(){
  clearTimeout(fanHideT);

  fanHideT=setTimeout(function(){ if(fanHasCallout()) fanRelease(); else collapseFan(); }, 320);
}
function expandFan(group, sticky){
  const root=document.getElementById('poi-fan');

  fanGroup=group; fanSticky=!!sticky;
  const p=map.latLngToContainerPoint([pois[group[0]].lat,pois[group[0]].lng]);
  const n=group.length;
  const radius=34+Math.max(0,n-3)*7;
  const spread=Math.min(150, 50*(n-1));
  const start=-90-spread/2;
  group.forEach(function(pi,k){
    const ang=(start+(n>1?spread*k/(n-1):0))*Math.PI/180;
    const x=p.x+radius*Math.cos(ang), y=p.y+radius*Math.sin(ang);
    const ic=POI_ICONS[pois[pi].icon]||POI_ICONS.spot;
    const line=document.createElement('i');
    line.className='pf-line';
    line.style.left=p.x+'px'; line.style.top=p.y+'px';
    line.style.width=radius+'px';
    line.style.transform='rotate('+(ang*180/Math.PI).toFixed(2)+'deg)';
    line.style.setProperty('--pc',ic.color);
    root.appendChild(line);
    const pin=document.createElement('div');
    pin.className='pf-pin';
    pin.style.left=x+'px'; pin.style.top=y+'px';
    pin.title=pois[pi].title||'';
    pin.innerHTML=stackIconHtml(pois[pi].icon,0).replace(/<span class="poi-count">0<[^>]*>/,'');
    const at=map.containerPointToLatLng(L.point(x,y));
    pin.addEventListener('click',function(ev){
      ev.stopPropagation();
      fanSticky=true; fanHold();
      window.openPoiCallout(pi, pin.querySelector('.poi-pin'), true, at);
    });
    if(!isTouch){
      pin.addEventListener('mouseenter',function(){ fanHold(); calloutHold(); window.openPoiCallout(pi, pin.querySelector('.poi-pin'), false, at); });
      pin.addEventListener('mouseleave',function(){ calloutRelease(); fanRelease(); });
    }

  });

}
function restackPoints(){
  collapseFan();
  stackMarkers.forEach(function(m){ if(map.hasLayer(m)) map.removeLayer(m); });
  stackMarkers=[];
  const vis=[];
  pois.forEach(function(p,i){
    const mk=window.poiMarkers[i];
    if(!mk) return;
    if(window.__poiVisible && !window.__poiVisible[i]){ if(map.hasLayer(mk)) map.removeLayer(mk); return; }
    vis.push(i);
  });
  const pts=vis.map(function(i){ return map.latLngToContainerPoint([pois[i].lat,pois[i].lng]); });
  const taken=vis.map(function(){ return false; });
  vis.forEach(function(pi,a){
    if(taken[a]) return;
    const group=[pi]; taken[a]=true;
    for(let b=a+1;b<vis.length;b++){
      if(taken[b]) continue;
      if(pts[a].distanceTo(pts[b])<=STACK_PX){ group.push(vis[b]); taken[b]=true; }
    }
    if(group.length===1){
      const mk=window.poiMarkers[pi];
      if(!map.hasLayer(mk)) mk.addTo(map);
      return;
    }
    group.forEach(function(i){ const mk=window.poiMarkers[i]; if(map.hasLayer(mk)) map.removeLayer(mk); });
    const head=pois[group[0]];
    const m=L.marker([head.lat,head.lng],{
      icon:L.divIcon({className:'',html:stackIconHtml(head.icon,group.length),iconSize:[20,20],iconAnchor:[10,10]}),
      zIndexOffset:720, title:group.length+' points at this spot'
    }).addTo(map);
    m.on('click',function(e){
      stopMapClick(e);
      if(fanGroup===group){ fanSticky=true; fanHold(); }   // already fanned by the hover - the click just keeps it
      else expandFan(group,true);
    });
    if(!isTouch){
      m.on('mouseover',function(){
        fanHold();
        if(fanGroup===group) return;
        if(calloutPinned() && fanHasCallout()) return;     // a fan holding a pinned panel is not stolen by a passing hover
        expandFan(group,false);
      });
      m.on('mouseout', fanRelease);
    }
    stackMarkers.push(m);
  });
}
map.on('zoomend', restackPoints);
map.on('movestart zoomstart move', collapseFan);   // move as well: an inertia glide sends no movestart
document.addEventListener('keydown', function(e){ if(e.key==='Escape') collapseFan(); });

/* Which stage a point belongs to is not written in the data, so it is taken to be the stage
   whose road runs closest to it. Worked out once, and only when there are stages to tell
   apart; every other point of the route is near enough for the comparison. */
window.poiStage=pois.map(function(){ return 0; });
if(stageGroups.length>1){
  window.poiStage=pois.map(function(poi){
    let best=0, bd=Infinity;
    stageGroups.forEach(function(g,gi){
      const cs=g.coords;
      for(let i=0;i<cs.length;i+=2){
        const dy=cs[i][0]-poi.lat, dx=(cs[i][1]-poi.lng)*Math.cos(poi.lat*Math.PI/180);
        const d=dy*dy+dx*dx;
        if(d<bd){ bd=d; best=gi; }
      }
    });
    return best;
  });
}
/* Which stage is being shown, or null for the whole rally. The labels and the points both
   read it, so it lives out here rather than inside the tab bar. */
let stageFocus=null;

/* ---- Stage labels ----
   With a stage picked, only that stage keeps its label. On the overview they all show, so
   they are placed in turn and any that would land on top of one already placed is dropped -
   a pile of overlapping names is the surest sign of a map nobody laid out. */
function layoutStageLabels(){
  const placed=[];
  const order=stageGroups.map(function(g,i){ return i; });
  if(stageFocus!==null) order.sort(function(a,b){ return (b===stageFocus)-(a===stageFocus); });
  order.forEach(function(i){
    const g=stageGroups[i], el=g.labelMarker&&g.labelMarker.getElement();
    if(!el) return;
    if(stageFocus!==null && i!==stageFocus){ el.style.display='none'; return; }
    el.style.display='';
    const r=(el.firstElementChild||el).getBoundingClientRect();
    const box={l:r.left-6, t:r.top-4, r:r.right+6, b:r.bottom+4};
    const clash=placed.some(function(p){ return !(box.r<p.l||box.l>p.r||box.b<p.t||box.t>p.b); });
    if(clash) el.style.display='none';
    else placed.push(box);
  });
}
map.on('moveend zoomend resize', layoutStageLabels);

/* ---- Stage draw-in ----
   A stage traces itself from start to finish when you pick it, the way a route is drawn on
   television. An SVG copy of the line does the drawing - a dash that shortens to nothing -
   while the real line waits underneath, so the canvas the rest of the map is drawn on is
   left alone. The real line is back the moment the trace ends, or if anything interrupts. */
const traceRenderer=L.svg({pane:'overlayPane'});
let traceLayers=null, traceRestore=null, traceTimer=0;
function traceClear(){
  clearTimeout(traceTimer);
  if(traceRestore){ traceRestore(); traceRestore=null; }
  if(traceLayers){ traceLayers.forEach(function(l){ if(map.hasLayer(l)) map.removeLayer(l); }); traceLayers=null; }
}
function traceStage(gIdx){
  traceClear();
  const g=stageGroups[gIdx];
  if(!g||g.coords.length<2) return;
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const layers=stageLayerGroups[gIdx]||[];
  layers.forEach(function(l){ l.core.setStyle({opacity:0}); l.glow.setStyle({opacity:0}); });
  traceRestore=function(){ layers.forEach(function(l){ l.core.setStyle({opacity:1}); l.glow.setStyle({opacity:1}); }); };
  const glow=L.polyline(g.coords,{renderer:traceRenderer,color:g.color,weight:10,opacity:.95,lineCap:'round',lineJoin:'round',interactive:false}).addTo(map);
  const core=L.polyline(g.coords,{renderer:traceRenderer,color:'#fff',weight:4,opacity:1,lineCap:'round',lineJoin:'round',interactive:false}).addTo(map);
  traceLayers=[glow,core];
  let drew=false;
  traceLayers.forEach(function(l){
    const path=l.getElement();
    if(!path) return;
    const len=path.getTotalLength();
    if(!len) return;
    drew=true;
    path.style.strokeDasharray=len+' '+len;
    path.style.strokeDashoffset=len;
    path.getBoundingClientRect();                 // let the empty line paint before it grows
    path.style.transition='stroke-dashoffset .8s cubic-bezier(.25,.8,.3,1)';
    path.style.strokeDashoffset='0';
