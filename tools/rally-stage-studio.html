}
map.on('dragstart zoomstart', function(){ if(traceLayers) traceClear(); });   // never leave a stage hidden

/* ---- Compass and scale ----
   The furniture a published stage map carries. Both sit in the top-left stack under the
   zoom buttons, where they are out of the way of the title card and the tab bar. */
(function initMapFurniture(){
  const Compass=L.Control.extend({

        +'<path d="M16 5.5 L20 17 L16 14.6 L12 17 Z" fill="#fc4d03"/>'
        +'<path d="M16 26.5 L12 17 L16 19.4 L20 17 Z" fill="rgba(255,255,255,.65)"/>'

/* ---- Fitting around the furniture ----
   Leaflet fits a route to the whole map box, but the title card, the key, the links and the
   tab bar all sit on top of that box - a stage fitted to the full frame ends up partly
   underneath them. This measures what each panel actually covers and pads that side, so a
   stage lands in the part of the frame you can still see.
   Wide screens push the left column out of the way sideways; on a phone the card is too
   wide a share of the screen for that, so its side becomes the top instead. */
function chromePadding(){
  const c=map.getContainer().getBoundingClientRect();
  const size=map.getSize();
  const pad={left:16,top:16,right:16,bottom:16};
  const rect=function(el){
    if(!el||!el.offsetWidth||!el.offsetHeight) return null;
    const s=getComputedStyle(el);
    if(s.display==='none'||s.visibility==='hidden') return null;
    return el.getBoundingClientRect();
  };
  const clear=function(el,sides){
    const r=rect(el);
    if(!r) return;
    if(sides.indexOf('left')>-1)   pad.left  =Math.max(pad.left,   r.right - c.left + 12);
    if(sides.indexOf('top')>-1)    pad.top   =Math.max(pad.top,    r.bottom - c.top + 12);
    if(sides.indexOf('right')>-1)  pad.right =Math.max(pad.right,  c.right - r.left + 12);
    if(sides.indexOf('bottom')>-1) pad.bottom=Math.max(pad.bottom, c.bottom - r.top + 12);
  };
  /* The title card and the key share the top-left corner, and a stage can go beside them or
     below them. Which one costs less of the frame depends on the window, so measure both
     and take the smaller bite - beside them on a wide screen, below them on a phone. */
  let colRight=0, colBottom=0;
  [document.getElementById('stage-info'),document.getElementById('poi-legend')].forEach(function(el){
    const r=rect(el);
    if(!r) return;
    colRight=Math.max(colRight, r.right - c.left + 12);
    colBottom=Math.max(colBottom, r.bottom - c.top + 12);
  });
  if(colRight){
    if(colRight/size.x <= colBottom/size.y) pad.left=Math.max(pad.left,colRight);
    else pad.top=Math.max(pad.top,colBottom);
  }
  clear(document.querySelector('.leaflet-top.leaflet-left'),['left']);   // zoom, compass and scale
  clear(document.querySelector('.map-style-switcher'),['top']);
  clear(document.getElementById('stage-switcher'),['bottom']);
  clear(document.getElementById('stage-links'),['bottom']);
  clear(document.getElementById('stage-logo'),['bottom']);
  clear(document.querySelector('.leaflet-bottom.leaflet-left'),['bottom']);   // the scale bar
  // a panel taller than the map would otherwise pad the route out of existence
  const capX=size.x*0.42, capY=size.y*0.42;
  pad.left=Math.min(pad.left,capX); pad.right=Math.min(pad.right,capX);
  pad.top=Math.min(pad.top,capY);   pad.bottom=Math.min(pad.bottom,capY);
  return {paddingTopLeft:L.point(pad.left,pad.top), paddingBottomRight:L.point(pad.right,pad.bottom)};
}
function fitInFrame(b,opts){ map.fitBounds(b,Object.assign(chromePadding(),opts||{})); }
function flyInFrame(b,opts){ map.flyToBounds(b,Object.assign(chromePadding(),opts||{})); }
let userTookOver=false;   // once the reader moves the map or picks a stage, we stop re-fitting it
if(sectors.length>0)map.fitBounds(bounds,{padding:[20,20]});

if(stageGroups.length>1){
  const switcher=document.getElementById('stage-switcher');
  const infoBox=document.getElementById('stage-info');

  /* The move waits for the new title: a long stage name grows the card, and a fit measured
     against the old one leaves the route tucked under it. */
  const swapInfo=(html,after)=>{

          // so a glow put back after its core would bury the white line

      });

    });

               function(){ flyInFrame(bounds,{duration:1.1,easeLinearity:0.25}); });

                 +(g.surface?'<span class="fact surface">'+escAttr(g.surface)+'</span>':'')},
               function(){

  switcher.appendChild(allBtn);

  });

  document.body.classList.add('has-switcher'); // lifts #stage-links and #stage-logo clear of the tab bar

/* ---- Map key ----
   One row per kind of point that is actually on this map, with a count. Clicking a row
   takes those markers off the map (and back); hovering one lifts the matching pins so a
   reader can see where they are. Starts folded on phones, where the map has little room. */
(function initPoiLegend(){

  const PLURAL={spot:'Spots',jump:'Jumps',water:'Water splashes',crash:'Crashes',hairpin:'Hairpins',crest:'Crests',chicane:'Chicanes',bridge:'Bridges',hazard:'Hazards',spectator:'Spectator areas',photo:'Photo spots',junction:'Junctions'};
  const kinds={};   // icon key -> [{mk, key, stage, i}]
  window.__poiVisible=pois.map(function(){ return true; });
  pois.forEach(function(poi,pi){
    const k=POI_ICONS[poi.icon]?poi.icon:'spot';   // same fallback the pins use
    (kinds[k]=kinds[k]||[]).push({mk:window.poiMarkers[pi], key:'poi'+pi, stage:window.poiStage[pi], i:pi});
  });
  const keys=Object.keys(POI_ICONS).filter(function(k){ return kinds[k]; });
  const hidden={};              // kinds the reader has switched off
  const quietOverview=stageGroups.length>1;   // a single-stage map has nothing to quieten
  let focus=null;               // the stage on show, or null for the whole rally
  if(quietOverview) keys.forEach(function(k){ hidden[k]=true; });
  const info=document.getElementById('stage-info');
  const small=!!(window.matchMedia&&window.matchMedia('(max-width:600px)').matches);
  const box=document.createElement('div');
  box.id='poi-legend';
  if(small) box.classList.add('collapsed');
  box.innerHTML='<button type="button" class="lg-toggle" aria-expanded="'+(!small)+'"><span>Map key</span>'
    +'<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>'
    +'<div class="lg-body">'
    +keys.map(function(k){
      const ic=POI_ICONS[k], name=PLURAL[k]||ic.label;
      return '<button type="button" class="lg-row" data-k="'+k+'" aria-pressed="true" title="Hide '+escAttr(name.toLowerCase())+'">'
        +'<span class="poi-pin lg-pin" style="--pc:'+ic.color+'"><svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="'+ic.color+'" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" style="color:'+ic.color+'">'+ic.path+'</svg></span>'
        +'<span class="lg-name">'+escAttr(name)+'</span><span class="lg-n">'+kinds[k].length+'</span></button>';
    }).join('')
    +'<button type="button" class="lg-reset" hidden>Show all</button></div>';
  document.body.appendChild(box);
  const toggle=box.querySelector('.lg-toggle'), reset=box.querySelector('.lg-reset');

  const inScope=function(o){ return focus===null || o.stage===focus; };
  const countOf=function(k){ return kinds[k].filter(inScope).length; };
  /* Draws whatever the key currently says: a kind that is switched on, on the stage in view.
     With the whole rally on screen nothing is drawn until the reader asks for a kind, which
     is what keeps the overview readable. */
  function applyPoints(){
    keys.forEach(function(k){
      const on=!hidden[k];
      kinds[k].forEach(function(o){
        const show=on&&inScope(o);
        window.__poiVisible[o.i]=show;
        if(!show && calloutKey()===o.key) closeCallout();
      });
      const row=box.querySelector('.lg-row[data-k="'+k+'"]');
      if(!row) return;
      const n=countOf(k);
      row.querySelector('.lg-n').textContent=n;
      row.hidden=(n===0);                       // a kind this stage does not have
      row.classList.toggle('off',!on);
      row.setAttribute('aria-pressed',String(on));
      row.title=(on?'Hide ':'Show ')+row.querySelector('.lg-name').textContent.toLowerCase();
    });
    reset.hidden=!keys.some(function(k){ return hidden[k]&&countOf(k); });
    restackPoints();          // the pins that are showing get re-gathered into their spots
    place();
  }
  /* The tab bar calls this: a stage shows its own points, the overview goes quiet again. */
  window.__pointsForStage=function(idx){
    focus=(idx===null||idx===undefined)?null:idx;
    keys.forEach(function(k){ hidden[k]=(focus===null&&quietOverview); });
    highlight(null);
    applyPoints();
  };
  function highlight(k){
    keys.forEach(function(x){ kinds[x].forEach(function(o){
      const el=o.mk.getElement(), pin=el&&el.querySelector('.poi-pin');
      if(pin) pin.classList.toggle('lg-hl',x===k);
    }); });
  }
  /* Sit under the info box, and never run down into the links or the stage tabs. */
  function place(){
    const r=info?info.getBoundingClientRect():{left:10,bottom:0};
    const top=r.bottom+8;
    box.style.left=r.left+'px';
    box.style.top=top+'px';
    const b=box.getBoundingClientRect();
    let limit=window.innerHeight-8;
    ['stage-links','stage-switcher'].forEach(function(id){
      const el=document.getElementById(id);
      if(!el||el.offsetParent===null) return;
      const t=el.getBoundingClientRect();
      if(t.left<b.right && t.right>b.left) limit=Math.min(limit,t.top-8);
    });
    box.style.maxHeight=Math.max(toggle.offsetHeight+40,limit-top)+'px';
  }

  box.addEventListener('click',function(e){
    const row=e.target.closest('.lg-row');
    if(!row) return;
    const k=row.dataset.k;
    hidden[k]=!hidden[k];
    if(hidden[k]) highlight(null);
    applyPoints();
  });
  box.addEventListener('mouseover',function(e){
    const row=e.target.closest('.lg-row');
    highlight(row&&!hidden[row.dataset.k]?row.dataset.k:null);
  });
  box.addEventListener('mouseleave',function(){ highlight(null); });
  toggle.addEventListener('click',function(){
    const folded=box.classList.toggle('collapsed');
    toggle.setAttribute('aria-expanded',String(!folded));
    place();
  });
  reset.addEventListener('click',function(){
    keys.forEach(function(k){ hidden[k]=false; });
    applyPoints();
  });

  applyPoints();
  window.addEventListener('resize',place);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(place);
  // the info box changes height when a stage tab swaps its title in
  if(info&&window.ResizeObserver) new ResizeObserver(place).observe(info);
})();

/* The tab bar and the key are only on the page at this point, so the opening view is fitted
   again now that there is something to measure - but never after the reader has taken over. */
if(sectors.length>0){
  map.on('dragstart',function(){ userTookOver=true; });
  const fitAll=function(){ if(!userTookOver) fitInFrame(bounds); };
  fitAll();
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitAll);
}

/* ---- Full screen ----
   Inside an iframe the Fullscreen API only works when the embedding <iframe> carries
   allow="fullscreen" (or allowfullscreen). Google Sites' embed wrapper does not always
   pass that through, and iOS Safari has no element fullscreen at all, so when the API is
   blocked we fall back to opening this map at top level in a new tab. */
(function initFullscreen(){
  const btn=document.getElementById('fs-btn');
  if(!btn) return;
  const ICON_IN='<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
  const ICON_OUT='<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';
  const root=document.documentElement;
  const req=root.requestFullscreen||root.webkitRequestFullscreen||root.webkitRequestFullScreen||root.msRequestFullscreen;
  const exitFs=document.exitFullscreen||document.webkitExitFullscreen||document.webkitCancelFullScreen||document.msExitFullscreen;
  const flag=(document.fullscreenEnabled!==undefined)?document.fullscreenEnabled:document.webkitFullscreenEnabled;
  const canFS=!!req && flag!==false;
  const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement||document.msFullscreenElement||null;
  let toastT=0;
  function toast(msg){
    let t=document.getElementById('fs-toast');
    if(!t){ t=document.createElement('div'); t.id='fs-toast'; document.body.appendChild(t); }
    t.textContent=msg; t.classList.add('show');
    clearTimeout(toastT); toastT=setTimeout(function(){t.classList.remove('show');},4500);
  }
  function paint(){
    const on=!!fsEl();
    btn.innerHTML=on?ICON_OUT:ICON_IN;
    btn.title=on?'Exit full screen':(canFS?'Full screen':'Open full screen in a new tab');
    btn.setAttribute('aria-label',btn.title);
    btn.classList.toggle('active',on);
    setTimeout(function(){map.invalidateSize();},150); // the map box just changed size
  }
  /* Our own URL is only worth reopening when this file really is the framed document.
     Inside a Google Sites embed we are running in Google's gadget wrapper, so its URL
     would open an empty shell - detect that and rebuild the map from PAGE_SRC instead. */
  function ownUrl(){
    try{
      if(location.protocol!=='http:'&&location.protocol!=='https:') return '';
      const host=(location.hostname||'').toLowerCase(), path=(location.pathname||'').toLowerCase();
      if(host.indexOf('googleusercontent.com')>-1) return '';   // Google Sites' gadget wrapper
      if(path.indexOf('/embed/')>-1||path.indexOf('/embeds/')>-1) return '';
      return location.href;
    }catch(_){ return ''; }
  }
  function writeSelfInto(w){
    let src=PAGE_SRC;
    // carry the basemap the viewer is actually looking at into the new tab
    try{ src=src.replace(/let currentMapStyle = '[a-z]+';/, "let currentMapStyle = '"+currentMapStyle+"';"); }catch(_){}
    // the same reader in a new tab is the same view, so the counter does not travel with it
    try{ src=src.replace(/<script[^>]*gc\\.zgo\\.at[^>]*><\\/script>/g,'').replace(/<script>window\\.goatcounter=[\\s\\S]*?<\\/script>/g,''); }catch(_){}
    w.document.open(); w.document.write(src); w.document.close();
  }
  function openTopLevel(){
    const url=ownUrl();
    let w=null;
    try{ w=window.open(url||'','_blank'); }catch(_){}
    if(!w){ toast('Allow pop-ups for this page to open the map full screen.'); return; }
    if(url) return;                       // the real file will load on its own
    try{ writeSelfInto(w); }
    catch(_){ try{ w.close(); }catch(__){} toast('This page could not open the map in a new tab.'); }
  }
  btn.addEventListener('click',function(e){
    e.preventDefault();
    if(fsEl()){ try{ exitFs.call(document); }catch(_){} return; }
    if(!canFS){ openTopLevel(); return; }
    let p;
    try{ p=req.call(root,{navigationUI:'hide'}); }catch(_){ openTopLevel(); return; }
    if(p&&typeof p.catch==='function') p.catch(openTopLevel);
  });
  ['fullscreenchange','webkitfullscreenchange','MSFullscreenChange'].forEach(function(ev){document.addEventListener(ev,paint);});
  paint();
})();
<\/script>
${analyticsCode ? `<!-- View counting: GoatCounter, cookieless. Remove these two lines to stop counting. -->
<script>window.goatcounter={path:${jsonForScript(analyticsPath())},title:${jsonForScript(stageHeading)}};<\/script>
<script data-goatcounter="https://${analyticsCode}.goatcounter.com/count" async src="//gc.zgo.at/count.js"><\/script>` : ''}
</body></html>`;
}
</script>
