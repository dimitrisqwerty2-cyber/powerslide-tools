:root{
  color-scheme:light;
  --display:"PS WRC Clean","Lato",Arial,sans-serif;
  --body:"Open Sans",Arial,sans-serif;
  --ink:#2a2a2c; --ink-soft:#2e3d39; --ink-mute:#4a5e58; --text:#080f13; --on-gold:#1c1c1c;
  --glitch-ink:#303033; --accent:#0f9e72; --placeholder:#5f7a72;
  --hi:rgba(255,255,255,.35); --hi-strong:rgba(255,255,255,.5); --divider-hi:rgba(255,255,255,.7);
  --foot-ink:#2b2b2e; --page:#0c4a45;
  --band-top:linear-gradient(#d9d9dc,#c8c8cc);
  --band-foot:linear-gradient(#c3c3c8,#b5b5ba);
  --strip:linear-gradient(rgba(16,150,92,.95),rgba(0,122,124,.95));
  --strip-edge:rgba(0,48,40,.85);
  --rail:linear-gradient(rgba(58,190,128,.92),rgba(0,146,146,.92));
  --sep-edge:rgba(0,40,34,.8);
  --cell:linear-gradient(rgba(234,246,241,.9),rgba(208,235,225,.9) 55%,rgba(178,220,205,.9));
  --cell-solid:linear-gradient(#e8f5ef,#cfe9de 55%,#b2dccd);
  --gold:linear-gradient(#fcbf2a,#f5a91c 60%,#e2900e);
  --drop:rgba(0,46,38,.55);
  --tile-edge:rgba(0,22,18,.85);
  --gloss:linear-gradient(118deg,rgba(255,255,255,.30),rgba(255,255,255,.04) 42%,rgba(255,255,255,0) 43%,rgba(0,0,0,.28));
  --divider:#6f6f75;
  --logo-filter:none;
  --lcol:360px;
  --wrap:1440px;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ink:#e3f0eb; --ink-soft:#b8cec7; --ink-mute:#98b2aa; --text:#dfeae6;
  --glitch-ink:#dde8e4; --accent:#22b884; --placeholder:#8fa8a0;
  --hi:rgba(255,255,255,.07); --hi-strong:rgba(255,255,255,.12); --divider-hi:rgba(255,255,255,.06);
  --band-top:linear-gradient(#34333b,#2a2930); --band-foot:linear-gradient(#2d2c34,#24232a);
  --foot-ink:#dcd8e2; --divider:#18171c; --page:#071917;
  --strip:linear-gradient(rgba(12,122,78,.96),rgba(0,96,98,.96)); --strip-edge:rgba(0,14,12,.9);
  --rail:linear-gradient(rgba(16,112,80,.92),rgba(0,86,88,.92)); --sep-edge:rgba(0,10,8,.85);
  --cell:linear-gradient(rgba(36,66,60,.92),rgba(28,54,50,.92) 55%,rgba(21,43,40,.92));
  --cell-solid:linear-gradient(#25443e,#1c3632 55%,#152b28);
  --drop:rgba(0,0,0,.6); --tile-edge:rgba(0,8,6,.9);
  --logo-filter:invert(1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--text);font:500 15px/1.5 var(--body);overflow-x:hidden;min-height:100vh}
img{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
#glow{position:fixed;inset:0;width:100%;height:100%;z-index:-1;display:block;object-fit:cover}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* glitch titles */
.glitch{font:700 var(--gsize,52px)/1.1 var(--display);color:var(--glitch-ink);margin:0;position:relative;letter-spacing:.01em;overflow-wrap:anywhere}
.glitch canvas{display:block;max-width:100%}
.glitch.ready .gtxt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.top{background:var(--band-top);position:relative}
.top-in{display:grid;grid-template-columns:var(--lcol) 1fr;min-height:150px;max-width:none}
.brand{display:flex;align-items:flex-end;padding:0 28px 26px 48px;border-right:2px solid var(--divider);box-shadow:1px 0 0 var(--divider-hi)}
.brand img{height:68px;width:auto;filter:var(--logo-filter)}
.top-title{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding:0 32px 22px 22px;min-width:0}
.top-title .glitch{--gsize:54px;min-width:0}
.top-tools{display:flex;gap:8px;align-items:center;padding-bottom:8px;flex-shrink:0}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border:0;cursor:pointer;font:700 14.5px/1 var(--display);padding:10px 13px 9px;background:var(--cell-solid);color:var(--ink);box-shadow:0 4px 0 var(--drop),inset 0 2px 0 var(--hi-strong);text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--gold);color:var(--on-gold)}
.btn.gold{background:var(--gold);color:var(--on-gold);box-shadow:0 4px 0 var(--drop),inset 0 2px 0 rgba(255,255,255,.45)}
.btn.gold:hover{filter:brightness(1.06)}
.btn.danger:hover{background:linear-gradient(#e2574c,#b8352c);color:#fff}
.btn svg{width:16px;height:16px;flex-shrink:0}
.btn:focus-visible,.it:focus-visible,.tlab:focus-visible,.ibtn:focus-visible,.pick button:focus-visible{outline:3px solid #fcbf2a;outline-offset:2px}
.theme-btn .sun,:root[data-theme="dark"] .theme-btn .moon{display:none}
:root[data-theme="dark"] .theme-btn .sun{display:block}

/* green strip toolbar */
.strip{background:var(--strip);border-top:2px solid var(--strip-edge);border-bottom:2px solid var(--strip-edge);position:relative;z-index:5}
.bar{display:flex;gap:2px;justify-content:safe center;overflow-x:auto;scrollbar-width:none;padding:7px 16px 8px}
.bar::-webkit-scrollbar{display:none}
.bar button{flex:0 0 auto;border:0;background:none;cursor:pointer;font:700 15.5px/1 var(--display);color:#fff;padding:9px 11px 8px;white-space:nowrap;text-shadow:0 1px 0 rgba(0,30,24,.6)}
.bar button:hover{background:rgba(255,255,255,.16)}
.bar button.on{background:var(--gold);color:var(--on-gold);text-shadow:none;box-shadow:0 3px 0 var(--drop),inset 0 2px 0 rgba(255,255,255,.45)}
.bar .sep{width:2px;background:rgba(0,30,24,.35);margin:4px 8px;flex:0 0 2px}

/* panel with rails */
.panel{position:relative;padding:22px 0 44px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 56px;position:relative}
.wrap::before,.wrap::after{content:"";position:absolute;top:-22px;bottom:-44px;width:24px;background:var(--rail);box-shadow:0 0 0 2px var(--sep-edge);pointer-events:none}
.wrap::before{left:12px}.wrap::after{right:12px}

.cell{background:var(--cell);box-shadow:0 5px 0 var(--drop),inset 0 2px 0 var(--hi);color:var(--ink)}
.shead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;background:var(--band-top);padding:14px 18px 10px;margin:40px 0 18px;box-shadow:0 5px 0 var(--drop),inset 0 2px 0 var(--hi-strong);border-left:8px solid var(--accent)}
.shead .glitch{--gsize:32px}
.shead .note{font:500 13.5px/1.4 var(--body);color:var(--ink-soft);padding-bottom:4px}

/* ---------- the board ---------- */
.board{display:flex;flex-direction:column;gap:12px;--th:96px;--tw:144px;--ch:22px}
.tier{display:grid;grid-template-columns:150px minmax(0,1fr) 44px;gap:6px;align-items:stretch}
.tlab{--c1:#fcbf2a;--c2:#e2900e;--ti:#1c1c1c;background:linear-gradient(var(--c1),var(--c2));color:var(--ti);box-shadow:0 5px 0 var(--drop),inset 0 2px 0 rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px;font:700 var(--ls,44px)/1.05 var(--display);cursor:pointer;border:0;overflow-wrap:anywhere;min-height:calc(var(--th) + var(--ch) + 20px)}
.tlab.light-ink{text-shadow:0 2px 0 rgba(0,0,0,.35)}
.drop{background:var(--cell);box-shadow:0 5px 0 var(--drop),inset 0 2px 0 var(--hi);display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;padding:10px;min-height:calc(var(--th) + var(--ch) + 20px);position:relative}
.drop:empty::before{content:attr(data-hint);color:var(--placeholder);font:700 14px/1.3 var(--display);align-self:center;padding:0 6px;pointer-events:none}
.drop.over{outline:3px solid #fcbf2a;outline-offset:-3px}
.tctl{display:flex;flex-direction:column;gap:4px}
.ibtn{flex:1;border:0;cursor:pointer;background:var(--band-top);color:var(--ink);box-shadow:0 3px 0 var(--drop),inset 0 2px 0 var(--hi-strong);display:flex;align-items:center;justify-content:center;padding:0;min-height:26px}
.ibtn:hover{background:var(--gold);color:var(--on-gold)}
.ibtn svg{width:18px;height:18px}
.addrow{align-self:flex-start;margin-top:6px}

/* items */
.it{width:var(--tw);display:flex;flex-direction:column;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;position:relative;outline:none}
.it .tile{position:relative;height:var(--th);overflow:hidden;background:#202024;box-shadow:0 4px 0 var(--drop)}
.it .tile img{width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.it .tile::after{content:"";position:absolute;inset:0;background:var(--gloss);pointer-events:none;box-shadow:inset 0 0 0 2px var(--tile-edge)}
.it .cap{height:var(--ch);margin-top:4px;background:var(--cell-solid);box-shadow:0 3px 0 var(--drop),inset 0 2px 0 var(--hi-strong);color:var(--ink);font:700 12.5px/var(--ch) var(--display);text-align:center;padding:0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board.nocap .it .cap{display:none}
.board.nocap{--ch:0px}
.it.txt .tt{height:calc(var(--th) + var(--ch) + 4px);display:flex;align-items:center;justify-content:center;text-align:center;padding:6px 8px;font:700 var(--fs,17px)/1.12 var(--display);overflow:hidden;overflow-wrap:anywhere;box-shadow:0 4px 0 var(--drop),inset 0 2px 0 var(--hi-strong)}
.board.nocap .it.txt .tt{height:var(--th)}
.tt.s-cell{background:var(--cell-solid);color:var(--ink)}
.tt.s-gold{background:var(--gold);color:var(--on-gold)}
.tt.s-strip{background:var(--strip);color:#fff;text-shadow:0 1px 0 rgba(0,30,24,.6)}
.tt.s-dark{background:linear-gradient(#3a3a42,#24242a);color:#f2f2f4}
.it.ph{opacity:.35}
.it.ph .tile,.it.ph .tt{outline:2px dashed #fcbf2a;outline-offset:2px}
.ghost{position:fixed;z-index:1000;pointer-events:none;transform:rotate(-3deg) scale(1.06);filter:drop-shadow(0 10px 14px rgba(0,0,0,.45));cursor:grabbing}
body.dragging,body.dragging *{cursor:grabbing!important}

/* add items */
.addbox{padding:0}
.tabs{display:flex;gap:2px;background:var(--strip);padding:6px 8px 7px;border-bottom:2px solid var(--strip-edge);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;cursor:pointer;font:700 15px/1 var(--display);color:#fff;padding:9px 12px 8px;text-shadow:0 1px 0 rgba(0,30,24,.6);white-space:nowrap}
.tabs button:hover{background:rgba(255,255,255,.16)}
.tabs button[aria-selected="true"]{background:var(--gold);color:var(--on-gold);text-shadow:none;box-shadow:0 3px 0 var(--drop)}
.tabpane{padding:18px}
.tabpane[hidden]{display:none}
.dz{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--placeholder);padding:28px 16px;text-align:center;cursor:pointer;color:var(--ink-soft)}
.dz:hover,.dz.over{border-color:#fcbf2a;background:rgba(252,191,42,.08)}
.dz b{font:700 18px/1.2 var(--display);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font:700 12.5px/1 var(--display);text-transform:uppercase;letter-spacing:.07em;color:var(--ink-mute)}
.in{border:0;padding:9px 11px;background:var(--cell-solid);color:var(--ink);box-shadow:inset 0 2px 0 var(--hi-strong),0 3px 0 var(--drop);outline:0;font:600 15px/1.3 var(--body);min-width:0}
.in:focus{box-shadow:inset 0 0 0 2px #fcbf2a,0 3px 0 var(--drop)}
textarea.in{resize:vertical;min-height:90px}
select.in{cursor:pointer}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin-top:14px;max-height:420px;overflow:auto;padding:4px 4px 10px}
.pick button{border:0;padding:0;background:none;cursor:pointer;display:flex;flex-direction:column;gap:4px;text-align:center;color:var(--ink);font:700 12px/1.2 var(--display)}
.pick .pt{position:relative;aspect-ratio:184/128;background:#202024;box-shadow:0 3px 0 var(--drop);overflow:hidden}
.pick .pt img{width:100%;height:100%;object-fit:cover}
.pick .pt::after{content:"";position:absolute;inset:0;background:var(--gloss);box-shadow:inset 0 0 0 2px var(--tile-edge)}
.pick button[hidden]{display:none}
.pick button:hover .pt{outline:3px solid #fcbf2a}
.pick button.added .pt::before{content:"✓";position:absolute;right:4px;top:3px;z-index:2;background:var(--gold);color:var(--on-gold);font:700 12px/1 var(--display);padding:3px 5px}
.hint{font-size:13.5px;color:var(--ink-soft);margin:10px 0 0}

/* settings */
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px 18px;padding:18px}
.chk{display:flex;align-items:center;gap:8px;font:700 14px/1.2 var(--display);color:var(--ink);cursor:pointer}
.chk input{width:18px;height:18px;accent-color:#0f9e72}
input[type=range]{accent-color:#0f9e72;width:100%}

/* footer */
.foot{background:var(--band-foot);color:var(--foot-ink);font:700 14px/1.3 var(--display);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 48px}
.foot a{color:inherit}

/* dialogs */
dialog{border:0;padding:0;max-width:min(520px,calc(100vw - 32px));width:100%;background:var(--cell-solid);color:var(--ink);box-shadow:0 8px 0 var(--drop),0 20px 50px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(0,20,18,.55)}
.dh{background:var(--band-top);padding:14px 18px 10px;border-left:8px solid var(--accent);display:flex;justify-content:space-between;align-items:center;gap:10px}
.dh h2{margin:0;font:700 24px/1.1 var(--display);color:var(--glitch-ink)}
.db{padding:18px;display:flex;flex-direction:column;gap:14px}
.sw{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sw button{width:34px;height:34px;border:0;cursor:pointer;box-shadow:0 3px 0 var(--drop),inset 0 2px 0 rgba(255,255,255,.4)}
.sw button.on{outline:3px solid var(--ink);outline-offset:2px}
.sw input[type=color]{width:44px;height:34px;border:0;padding:0;background:none;cursor:pointer}
.mv{display:flex;gap:6px;flex-wrap:wrap}
.mv button{min-width:44px;justify-content:center}
.prev{display:flex;justify-content:center}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--gold);color:var(--on-gold);font:700 15px/1 var(--display);padding:12px 16px;box-shadow:0 5px 0 var(--drop);z-index:2000;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

@media (max-width:1000px){
  :root{--lcol:240px}
  .brand{padding:0 18px 22px 24px}.brand img{height:50px}
  .top-title .glitch{--gsize:40px}
}
@media (max-width:760px){
  .top-in{grid-template-columns:1fr;min-height:0}
  .brand{border-right:0;box-shadow:none;padding:16px 16px 6px}
  .brand img{height:40px}
  .top-title{padding:6px 16px 14px;align-items:center}
  .top-title .glitch{--gsize:30px}
  .wrap{padding:0 16px}
  .wrap::before,.wrap::after{display:none}
  .tier{grid-template-columns:72px minmax(0,1fr) 34px;gap:4px}
  .tlab{--ls:28px!important;padding:6px}
  .drop{padding:7px;gap:6px}
  .it .cap{font-size:10.5px;padding:0 3px}
  .it.txt .tt{font-size:min(var(--fs,17px),13px);padding:4px}
  .shead .glitch{--gsize:24px}
  .foot{padding:14px 16px}
  .tabpane,.sets{padding:14px}
}
</style>
</head>

<nav class="strip" aria-label="Tier list actions">
  <div class="bar">
    <button type="button" class="on" id="bPng">Save picture</button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" id="bClear">Reset ranking</button>
    <button type="button" id="bSave">Save template file</button>
    <button type="button" id="bOpen">Open template file</button>
    <button type="button" id="bNew">New blank template</button>
  </div>

<main class="panel">
  <div class="wrap">
    <div class="board" id="board">
      <div id="tiers" style="display:flex;flex-direction:column;gap:12px"></div>
      <button class="btn addrow" type="button" id="bAddTier">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add row</button>

      <div class="shead"><h2 class="glitch"><span class="gtxt">Unranked</span></h2><span class="note">Drag tiles into the rows. Tap a tile to rename, move or delete it.</span></div>
      <div class="drop" id="pool" data-tier="pool" data-hint="Your tiles land here. Add images, text, badges or flags below, or paste and drop pictures anywhere on the page."></div>
    </div>

    <div class="shead"><h2 class="glitch"><span class="gtxt">Add tiles</span></h2></div>
    <div class="cell addbox">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" aria-selected="true" data-tab="tImg">Images</button>
        <button type="button" role="tab" aria-selected="false" data-tab="tTxt">Text</button>
        <button type="button" role="tab" aria-selected="false" data-tab="tBadge">Car badges</button>
        <button type="button" role="tab" aria-selected="false" data-tab="tFlag">Flags</button>
      </div>
      <div class="tabpane" id="tImg" role="tabpanel">
        <label class="dz" id="dz">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>
          <b>Choose images or drop them here</b>
          <span>Several at once is fine. You can also paste a picture with Ctrl+V. The file name becomes the tile name.</span>
          <input type="file" id="fImg" accept="image/*" multiple class="vh">
        </label>
      </div>
      <div class="tabpane" id="tTxt" role="tabpanel" hidden>
        <div class="row" style="align-items:flex-end">
          <label class="fld" style="flex:1 1 280px"><span>Tile text (one per line for several)</span><textarea class="in" id="txtIn" placeholder="SS1 Sinatra&#10;SS4 Elatia&#10;Tarzan"></textarea></label>
          <div class="fld"><span>Style</span>
            <select class="in" id="txtStyle"><option value="cell">Mint cell</option><option value="gold">Gold</option><option value="strip">Green strip</option><option value="dark">Dark</option></select></div>
          <button class="btn gold" type="button" id="bTxt">Add text tiles</button>
        </div>
      </div>
      <div class="tabpane" id="tBadge" role="tabpanel" hidden>
        <div class="row"><button class="btn" type="button" id="bAllBadges">Add every badge</button><span class="hint" style="margin:0">The same tiles as the site's tables and standings.</span></div>
        <div class="pick" id="badgePick"></div>
      </div>
      <div class="tabpane" id="tFlag" role="tabpanel" hidden>
        <label class="fld" style="max-width:360px"><span>Search</span><input class="in" id="flagQ" placeholder="Greece, Finland, gb-wls…"></label>
        <div class="pick" id="flagPick"></div>
      </div>
    </div>

    <div class="shead"><h2 class="glitch"><span class="gtxt">Template</span></h2><span class="note">Everything saves on this device as you go.</span></div>
    <div class="cell sets">
      <label class="fld"><span>Title</span><input class="in" id="sTitle" maxlength="80"></label>

<script>
(function(){

var FLAGS=["ad", "ae", "af", "ag", "ai", "al", "am", "ao", "aq", "ar", "as", "at", "au", "aw", "ax", "az", "ba", "bb", "bd", "be", "bf", "bg", "bh", "bi", "bj", "bl", "bm", "bn", "bo", "bq", "br", "bs", "bt", "bv", "bw", "by", "bz", "ca", "cc", "cd", "cf", "cg", "ch", "ci", "ck", "cl", "cm", "cn", "co", "cr", "ct", "cu", "cv", "cw", "cx", "cy", "cz", "de", "dj", "dk", "dm", "do", "dz", "ec", "ee", "eg", "eh", "er", "es", "et", "eu", "fi", "fj", "fk", "fm", "fo", "fr", "ga", "gb", "gb-eng", "gb-nir", "gb-sct", "gb-wls", "gd", "ge", "gf", "gg", "gh", "gi", "gl", "gm", "gn", "gp", "gq", "gr", "gs", "gt", "gu", "gw", "gy", "hk", "hm", "hn", "hr", "ht", "hu", "id", "ie", "il", "im", "in", "io", "iq", "ir", "is", "it", "je", "jm", "jo", "jp", "ke", "kg", "kh", "ki", "km", "kn", "kp", "kr", "kw", "ky", "kz", "la", "lb", "lc", "li", "lk", "lr", "ls", "lt", "lu", "lv", "ly", "ma", "mc", "md", "me", "mf", "mg", "mh", "mk", "ml", "mm", "mn", "mo", "mp", "mq", "mr", "ms", "mt", "mu", "mv", "mw", "mx", "my", "mz", "na", "nc", "ne", "nf", "ng", "ni", "nl", "no", "np", "nr", "nu", "nz", "om", "pa", "pe", "pf", "pg", "ph", "pk", "pl", "pm", "pn", "pr", "ps", "pt", "pw", "py", "qa", "re", "ro", "rs", "ru", "rw", "sa", "sb", "sc", "sd", "se", "sg", "sh", "si", "sj", "sk", "sl", "sm", "sn", "so", "sr", "ss", "st", "sv", "sx", "sy", "sz", "tc", "td", "tf", "tg", "th", "tj", "tk", "tl", "tm", "tn", "to", "tr", "tt", "tv", "tw", "tz", "ua", "ug", "um", "un", "us", "uy", "uz", "va", "vc", "ve", "vg", "vi", "vn", "vu", "wf", "ws", "xk", "ye", "yt", "za", "zm", "zw"];
var FLAG_NAMES={'gb-eng':'England','gb-sct':'Scotland','gb-wls':'Wales','gb-nir':'Northern Ireland','ct':'Catalonia','eu':'European Union','un':'United Nations','xk':'Kosovo'};
var regionNames=null;try{regionNames=new Intl.DisplayNames(['en'],{type:'region'});}catch(e){}
function flagName(c){if(FLAG_NAMES[c])return FLAG_NAMES[c];try{if(regionNames){var n=regionNames.of(c.toUpperCase());if(n&&n.toUpperCase()!==c.toUpperCase())return n;}}catch(e){}return c.toUpperCase();}

/* row colours: the site's amber highlight first, then broadcast-style glossy cells */
var SWATCH=['#fcbf2a','#f5872a','#e2574c','#d9468f','#9b6ad6','#5b7fe0','#2aa7d6','#19ae65','#7cc44a','#c9c9cf','#6f6f78','#2a2a30'];
var DEFAULT_TIERS=[['S','#fcbf2a'],['A','#f5872a'],['B','#19ae65'],['C','#2aa7d6'],['D','#9b6ad6']];

function uid(){return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function $(id){return document.getElementById(id);}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
function blank(){return {v:1,title:'Tier List',sub:'',foot:'',shape:1.44,size:96,cap:true,pool:true,x2:false,
  tiers:DEFAULT_TIERS.map(function(t){return {id:uid(),label:t[0],color:t[1],items:[]};}),poolItems:[],items:{}};}
var S=blank();

/* ---------- colour helpers ---------- */
function hexRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(function(c){return c+c;}).join('');var n=parseInt(h,16);return [n>>16&255,n>>8&255,n&255];}
function rgbHex(r){return '#'+r.map(function(v){v=Math.max(0,Math.min(255,Math.round(v)));return (v<16?'0':'')+v.toString(16);}).join('');}
function mix(h,t,a){var c=hexRgb(h),d=hexRgb(t);return rgbHex(c.map(function(v,i){return v+(d[i]-v)*a;}));}
function tierGrad(h){return [mix(h,'#ffffff',.16),mix(h,'#000000',.12)];}
function lum(h){var c=hexRgb(h).map(function(v){v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);});return .2126*c[0]+.7152*c[1]+.0722*c[2];}
function inkFor(h){return lum(h)>.36?'#1c1c1c':'#ffffff';}

/* ---------- storage (IndexedDB, falls back to nothing) ---------- */
var idb=null;
function dbOpen(){return new Promise(function(res){try{var r=indexedDB.open('psTierList',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv');};r.onsuccess=function(){idb=r.result;res(idb);};r.onerror=function(){res(null);};}catch(e){res(null);}});}
function dbGet(k){return new Promise(function(res){if(!idb)return res(null);try{var q=idb.transaction('kv').objectStore('kv').get(k);q.onsuccess=function(){res(q.result||null);};q.onerror=function(){res(null);};}catch(e){res(null);}});}
function dbPut(k,v){try{if(idb)idb.transaction('kv','readwrite').objectStore('kv').put(v,k);}catch(e){}}
var saveT;function save(){clearTimeout(saveT);saveT=setTimeout(function(){dbPut('state',JSON.parse(JSON.stringify(S)));},250);}

function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},2200);}

/* ---------- background glow + glitch titles (same as the site) ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var WARM={base:['#0c4a45','#1f8f6a','#11786f','#0b4a52'],
  blobs:[[700,560,450,2.2,'#36cf8c',.8],[780,500,240,2.6,'#e2fff2',.6],[990,700,270,1.6,'#00b0a2',.6],
         [560,690,200,2.4,'#f2b04a',.32],[140,500,380,1.2,'#0a3e48',.85],[1360,420,360,1.2,'#0b5a58',.8],[900,630,170,3.2,'#05302b',.45]],
  streak:['rgba(225,255,242,','rgba(0,30,25,']};
var NIGHT={base:['#06191a','#0d3a31','#0a2f2d','#071d26'],
  blobs:[[700,560,450,2.2,'#19ae65',.36],[780,500,240,2.6,'#c6f3e2',.1],[990,700,270,1.6,'#009696',.32],
         [560,690,200,2.4,'#c98a32',.13],[140,500,380,1.2,'#062a30',.8],[1360,420,360,1.2,'#0a3a3a',.7],[900,630,170,3.2,'#021412',.5]],
  streak:['rgba(200,255,235,','rgba(0,0,0,']};
function dark(){return document.documentElement.getAttribute('data-theme')==='dark';}
function blob(ctx,x,y,r,sx,color,alpha){ctx.save();ctx.translate(x,y);ctx.scale(sx,1);var g=ctx.createRadialGradient(0,0,0,0,0,r);g.addColorStop(0,color);g.addColorStop(1,'rgba(0,0,0,0)');ctx.globalAlpha=alpha;ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();ctx.restore();}
function paintGlow(c,isDark){
  var W=1440,H=1080;c.width=W;c.height=H;var ctx=c.getContext('2d'),T=isDark?NIGHT:WARM;
  var g=ctx.createLinearGradient(0,0,W,0);[0,.45,.7,1].forEach(function(o,i){g.addColorStop(o,T.base[i]);});
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(0,-80);ctx.scale(1,1.15);T.blobs.forEach(function(b){blob(ctx,b[0],b[1],b[2],b[3],b[4],b[5]);});ctx.restore();
  var r=rng(7);for(var i=0;i<260;i++){var y=r()*H,x=r()*W,w=120+r()*600,a=.02+r()*.05;ctx.fillStyle=(r()<.5?T.streak[0]:T.streak[1])+a+')';ctx.fillRect(x,y,w,1+r()*3);}
  return c;
}
/* glitch text: speckle the glyphs, then shear thin horizontal slices. Returns a canvas. */
function glitchCanvas(txt,s,color,isDark,seed){
  var m=document.createElement('canvas').getContext('2d');m.font='700 '+s+'px "PS WRC Clean"';
  var ow=Math.ceil(m.measureText(txt).width+s*.2)+20,oh=Math.ceil(s*1.42);
  var o=document.createElement('canvas');o.width=ow;o.height=oh;
  var ox=o.getContext('2d');ox.font='700 '+s+'px "PS WRC Clean"';ox.textBaseline='alphabetic';ox.fillStyle=color;ox.fillText(txt,10,s*1.1);
  var id=ox.getImageData(0,0,ow,oh),d=id.data,r=rng(seed||11),sp=isDark?70:200;
  for(var i=0;i<d.length;i+=4){if(d[i+3]>0&&r()<.07){d[i]=d[i+1]=d[i+2]=sp;}}
  ox.putImageData(id,0,0);
  var c=document.createElement('canvas');c.width=ow;c.height=oh;var ctx=c.getContext('2d'),step=Math.max(2,Math.round(3*s/52));
  for(var sy=0;sy<oh;sy+=step){var off=r()<.22?(r()*2-1)*s*.06:0;ctx.drawImage(o,0,sy,ow,step,off,sy,ow,step);}
  return c;
}
function glitchOne(e){
  var txt=e.getAttribute('data-text')||e.textContent.trim();if(!txt)return;
  var cs=getComputedStyle(e),size=parseFloat(cs.fontSize),dpr=Math.min(window.devicePixelRatio||1,2);
  var maxW=e.parentNode.clientWidth;
  var key=txt+'|'+size+'|'+dpr+'|'+maxW+'|'+cs.color;if(e._gk===key)return;e._gk=key;
  var c=glitchCanvas(txt,size*dpr,cs.color||'#303033',dark(),11);
  var old=e.querySelector('canvas');if(old)old.remove();
  c.setAttribute('aria-hidden','true');c.style.width=(c.width/dpr)+'px';e.appendChild(c);e.classList.add('ready');
}
function glitchAll(){document.querySelectorAll('.glitch').forEach(glitchOne);}
function label(){var d=dark();document.querySelectorAll('[data-theme-toggle]').forEach(function(b){b.setAttribute('aria-label',d?'Switch to light mode':'Switch to dark mode');var l=b.querySelector('.lbl');if(l)l.textContent=d?'Light':'Dark';});}
function setTheme(t,keep){document.documentElement.setAttribute('data-theme',t);if(keep){try{localStorage.setItem('psTheme',t);}catch(e){}}paintGlow($('glow'),dark());glitchAll();label();}
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-theme-toggle]');if(b)setTheme(dark()?'light':'dark',true);});

/* ---------- rendering the board ---------- */
function setTitle(){var h=$('ttl');h.setAttribute('data-text',S.title||'Tier List');h.querySelector('.gtxt').textContent=S.title||'Tier List';h._gk=null;document.title=(S.title||'Tier List')+' · Powerslide Tier List';glitchOne(h);}
function boardVars(){
  /* phones: shrink the tiles on screen only (the picture keeps the chosen size) */
  var f=innerWidth<760?Math.max(.3,Math.min(1,((innerWidth-162-14)/3)/(S.size*S.shape))):1;   // room for 3 tiles per line
  var b=$('board'),th=Math.max(36,Math.round(S.size*f)),tw=Math.round(th*S.shape),ch=S.cap?Math.max(16,Math.round(th*.22)):0;
  b.style.setProperty('--th',th+'px');b.style.setProperty('--tw',tw+'px');b.style.setProperty('--ch',ch+'px');
  b.classList.toggle('nocap',!S.cap);
}
function itemNode(id){
  var it=S.items[id];if(!it)return null;
  var n=el('div','it'+(it.kind==='text'?' txt':''));n.dataset.id=id;n.tabIndex=0;n.setAttribute('role','button');
  n.setAttribute('aria-label',(it.name||'Tile')+'. Drag to rank, or press Enter for options.');
  if(it.kind==='text'){
    var t=el('div','tt s-'+(it.style||'cell'),it.name);n.appendChild(t);
    var L=(it.name||'').length;t.style.setProperty('--fs',Math.max(11,Math.min(22,Math.round(S.size*(L<8?.24:L<16?.19:L<28?.15:.12))))+'px');
  }else{
    var tile=el('div','tile'),img=new Image();img.alt='';img.draggable=false;img.src=it.src;tile.appendChild(img);n.appendChild(tile);
    n.appendChild(el('div','cap',it.name||''));
  }
  return n;
}
function labelSize(txt){var L=(txt||'').length;return L<=2?44:L<=4?34:L<=8?24:L<=14?19:16;}
function tierNode(t,i){
  var row=el('div','tier');row.dataset.id=t.id;
  var g=tierGrad(t.color),ink=inkFor(t.color);
  var lab=el('button','tlab'+(ink==='#ffffff'?' light-ink':''),t.label);lab.type='button';
  lab.style.setProperty('--c1',g[0]);lab.style.setProperty('--c2',g[1]);lab.style.setProperty('--ti',ink);lab.style.setProperty('--ls',labelSize(t.label)+'px');
  lab.setAttribute('aria-label','Row '+t.label+': edit label and colour');
  lab.addEventListener('click',function(){openTier(t.id);});
  var drop=el('div','drop');drop.dataset.tier=t.id;drop.dataset.hint='';
  t.items.forEach(function(id){var n=itemNode(id);if(n)drop.appendChild(n);});
  var ctl=el('div','tctl');
  ctl.appendChild(iconBtn('<circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>','Row settings',function(){openTier(t.id);}));
  ctl.appendChild(iconBtn('<path d="M6 15l6-6 6 6"/>','Move row up',function(){moveTier(t.id,-1);},i===0));
  ctl.appendChild(iconBtn('<path d="M6 9l6 6 6-6"/>','Move row down',function(){moveTier(t.id,1);},i===S.tiers.length-1));
  row.appendChild(lab);row.appendChild(drop);row.appendChild(ctl);
  return row;
}
function iconBtn(path,lab,fn,dis){var b=el('button','ibtn');b.type='button';b.setAttribute('aria-label',lab);b.title=lab;b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+path+'</svg>';b.addEventListener('click',fn);if(dis){b.disabled=true;b.style.opacity=.4;b.style.cursor='default';}return b;}
function render(){
  boardVars();
  var host=$('tiers');host.textContent='';
  S.tiers.forEach(function(t,i){host.appendChild(tierNode(t,i));});
  var pool=$('pool');pool.textContent='';
  S.poolItems.forEach(function(id){var n=itemNode(id);if(n)pool.appendChild(n);});
  markAdded();
}
function syncFromDom(){
  S.tiers.forEach(function(t){var d=document.querySelector('.drop[data-tier="'+t.id+'"]');if(d)t.items=[].map.call(d.querySelectorAll('.it'),function(n){return n.dataset.id;});});
  S.poolItems=[].map.call($('pool').querySelectorAll('.it'),function(n){return n.dataset.id;});
  save();
}
function settingsToUi(){
  $('sTitle').value=S.title;$('sSub').value=S.sub;$('sFoot').value=S.foot;
  $('sShape').value=String(S.shape);if($('sShape').value!==String(S.shape)){S.shape=1.44;$('sShape').value='1.44';}
  $('sSize').value=S.size;$('oSize').textContent=S.size+' px';$('sCap').checked=S.cap;$('sPool').checked=S.pool;$('s2x').checked=S.x2;
}

/* ---------- tiers ---------- */
function findTier(id){for(var i=0;i<S.tiers.length;i++)if(S.tiers[i].id===id)return i;return -1;}
function moveTier(id,d){var i=findTier(id),j=i+d;if(i<0||j<0||j>=S.tiers.length)return;var t=S.tiers.splice(i,1)[0];S.tiers.splice(j,0,t);render();save();}
function addTier(at){var used=S.tiers.map(function(t){return t.color;}),col=SWATCH.find(function(c){return used.indexOf(c)<0;})||'#c9c9cf';
  var t={id:uid(),label:'New',color:col,items:[]};S.tiers.splice(at==null?S.tiers.length:at,0,t);render();save();return t;}
var curTier=null;
function openTier(id){
  curTier=id;var t=S.tiers[findTier(id)];if(!t)return;
  $('tdLabel').value=t.label;
  var sw=$('tdSw');sw.textContent='';
  SWATCH.forEach(function(c){var b=el('button');b.type='button';b.style.background='linear-gradient('+tierGrad(c).join(',')+')';b.setAttribute('aria-label','Colour '+c);if(c.toLowerCase()===t.color.toLowerCase())b.className='on';
    b.addEventListener('click',function(){t.color=c;render();save();openTier(id);});sw.appendChild(b);});
  var ci=document.createElement('input');ci.type='color';ci.value=t.color;ci.title='Any colour';ci.setAttribute('aria-label','Any colour');
  ci.addEventListener('input',function(){t.color=ci.value;render();save();});sw.appendChild(ci);
  if(!$('tierDlg').open)$('tierDlg').showModal();
}
$('tdLabel').addEventListener('input',function(){var t=S.tiers[findTier(curTier)];if(!t)return;t.label=this.value;render();save();});
$('tdAbove').addEventListener('click',function(){var i=findTier(curTier);var t=addTier(i);openTier(t.id);$('tdLabel').select();});
$('tdBelow').addEventListener('click',function(){var i=findTier(curTier);var t=addTier(i+1);openTier(t.id);$('tdLabel').select();});
$('tdClear').addEventListener('click',function(){var t=S.tiers[findTier(curTier)];if(!t)return;S.poolItems=S.poolItems.concat(t.items);t.items=[];render();save();toast('Tiles sent back to Unranked');});
$('tdDel').addEventListener('click',function(){var i=findTier(curTier);if(i<0)return;var t=S.tiers[i];
  if(t.items.length&&!confirm('Delete row "'+t.label+'"? Its '+t.items.length+' tile(s) go back to Unranked.'))return;
  S.poolItems=S.poolItems.concat(t.items);S.tiers.splice(i,1);$('tierDlg').close();render();save();});
$('bAddTier').addEventListener('click',function(){var t=addTier();openTier(t.id);$('tdLabel').select();});

/* ---------- items ---------- */
function addItem(it,toPool){var id=uid();S.items[id]=it;S.poolItems.push(id);return id;}
function removeItem(id){delete S.items[id];S.tiers.forEach(function(t){t.items=t.items.filter(function(x){return x!==id;});});S.poolItems=S.poolItems.filter(function(x){return x!==id;});}
var curItem=null;
function openItem(id){
  curItem=id;var it=S.items[id];if(!it)return;
  var p=$('idPrev');p.textContent='';var n=itemNode(id);n.style.cursor='default';n.removeAttribute('tabindex');n.removeAttribute('role');

    if(S.sub){ctx.font='700 21px "PS WRC Clean"';ctx.textBaseline='middle';ctx.fillStyle='rgba(0,30,24,.6)';var st=ellipsis(ctx,S.sub,W-120);ctx.fillText(st,X0+2,sy+STRIP/2+2);ctx.fillStyle='#fff';ctx.fillText(st,X0+2,sy+STRIP/2+1);ctx.textBaseline='alphabetic';}

      var pg=glitchCanvas('Unranked',30*k,P.glitch,isDark,5);ctx.drawImage(pg,X0+26-10,y+hh-13-30*1.1,pg.width/k,pg.height/k);
      y+=hh+20;cellBox(ctx,P,X0,y,X1-X0,poolL.h,vg(ctx,y,y+poolL.h,P.cell));
      S.poolItems.forEach(function(id,i){var it=S.items[id];if(!it)return;var col=i%poolL.per,row=Math.floor(i/poolL.per);drawItem(ctx,P,it,srcs[it.src],X0+pad+col*(tw+gap),y+pad+row*(ih+gap),tw,th,ch);});

    var fy=H-FOOT;ctx.fillStyle=vg(ctx,fy,H,P.bandFoot);ctx.fillRect(0,fy,W,FOOT);ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(0,fy,W,2);

    if(S.foot)ctx.fillText(ellipsis(ctx,S.foot,W-460),X0,fy+FOOT/2+1);
    ctx.textAlign='right';ctx.fillText('powerslideblog.com',X1,fy+FOOT/2+1);ctx.textAlign='left';ctx.textBaseline='alphabetic';
    var done=function(){btn.textContent='Save picture';};
    try{c.toBlob(function(b){if(b){download(b,slug(S.title)+'.png');toast('Picture saved ('+c.width+'×'+c.height+')');}else toast('Could not make the picture');done();},'image/png');}
    catch(e){toast('A tile picture blocked the export');done();}

}
